name: Apply review completion rule

on:
  push:
    branches: [fix/review-requires-correct]
    paths:
      - '.github/workflows/apply-review-requires-correct.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-requires-correct
          fetch-depth: 0
      - name: Keep due reviews active until correct
        run: python .github/scripts/patch-review-requires-correct.py
      - name: Check JavaScript syntax
        run: node --check flashcard-study.js
      - name: Verify review behavior patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const wasDueBeforeAnswer" flashcard-study.js
          test "$(grep -c "wasDueBeforeAnswer ? previousNextReviewAt" flashcard-study.js)" -eq 2
          grep -q "result === 'known' && wasDueBeforeAnswer" flashcard-study.js
      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add flashcard-study.js
          git commit -m 'Keep due reviews active until answered correctly'
          git push origin HEAD:fix/review-requires-correct
