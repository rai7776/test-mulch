name: Create Study feedback savepoint

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/create-study-feedback-savepoint.yml'

permissions:
  contents: write

jobs:
  savepoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0

      - name: Create savepoint and clean temporary phase 3 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          target='10e1a8f9e14a5f3887ef4c4e8a682fe1ae6d4510'
          tag='save/2026-09-14-before-study-feedback'
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
          rm -f .github/workflows/apply-study-history-phase3.yml
          rm -f .github/scripts/patch-study-history-phase3.py
          rm -f .github/workflows/create-study-feedback-savepoint.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Clean temporary Study Center phase 3 tooling'
            git push origin HEAD:feature/study-center
          fi
