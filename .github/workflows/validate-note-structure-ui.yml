name: Validate note structure UI
on:
  push:
    branches:
      - feature/note-structure-ui-impl
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add script load
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '    <script src="folder-panel-context.js?v=1.0"></script>\n'
          new = old + '    <script src="note-structure-ui.js?v=1.0"></script>\n'
          assert old in s, 'folder panel script marker missing'
          if 'note-structure-ui.js' not in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
      - name: Check JavaScript syntax
        run: node --check note-structure-ui.js
      - name: Test range resolution
        run: |
          node <<'NODE'
          global.window = {};
          global.document = {
            readyState: 'loading',
            addEventListener() {},
            querySelector() { return null; },
            getElementById() { return null; }
          };
          require('./note-structure-ui.js');
          const api = global.window.SmartReaderNoteStructureUI;
          if (!api) throw new Error('API missing');
          const sample = api.sample;
          const second = api.findOccurrenceRange('that x that', 'that', 2);
          if (!second || second.start !== 7) throw new Error('occurrence resolution failed');
          const roots = api.resolveAnnotations(sample.originalText, sample.structure);
          const a2 = roots.find(x => x.id === 'a2');
          if (!a2) throw new Error('outer modifier missing');
          if (!a2.children.some(x => x.id === 'a3')) throw new Error('nested core missing');
          if (!a2.children.some(x => x.id === 'a4')) throw new Error('nested modifier missing');
          if (!roots.some(x => x.id === 'a5') || !roots.some(x => x.id === 'a6')) throw new Error('core roots missing');
          console.log('note structure range tests passed');
          NODE
      - name: Verify integration markers
        run: |
          grep -q 'note-structure-ui.js?v=1.0' index.html
          grep -q '文構造サンプル' note-structure-ui.js
          grep -q 'notation-angle' note-structure-ui.js
          grep -q 'notation-square' note-structure-ui.js
          grep -q 'notation-round' note-structure-ui.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html note-structure-ui.js
          if ! git diff --cached --quiet; then
            git commit -m "Integrate note structure preview UI"
            git push
          fi
