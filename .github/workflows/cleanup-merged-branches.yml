name: Cleanup merged branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches already represented by main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          deleted=0
          kept=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            case "$branch" in
              main|HEAD) continue ;;
            esac

            if git merge-base --is-ancestor "refs/remotes/origin/$branch" "refs/remotes/origin/main"; then
              reason="fully merged"
            elif git diff --quiet "refs/remotes/origin/main" "refs/remotes/origin/$branch"; then
              reason="tree identical to main"
            else
              echo "KEEP   $branch"
              git diff --stat "refs/remotes/origin/main" "refs/remotes/origin/$branch" | sed 's/^/       /'
              kept=$((kept + 1))
              continue
            fi

            echo "DELETE $branch ($reason)"
            git push origin --delete "$branch"
            deleted=$((deleted + 1))
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          echo "Deleted: $deleted"
          echo "Kept: $kept"
