name: Create pre-flashcard baseline savepoint

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/create-pre-flashcard-baseline-savepoint.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create savepoint
        run: |
          set -euo pipefail
          tag='save/2026-09-15-before-flashcard-baseline-rollback'
          target='9aabd6ac9092f29445d8c813a540abebf4443165'
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$target"
