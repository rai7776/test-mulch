name: Create flashcard auto audio savepoint

on:
  push:
    branches: [feature/flashcard-auto-audio]
    paths:
      - '.github/workflows/create-auto-audio-savepoint.yml'

permissions:
  contents: write

jobs:
  savepoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create stable save tag
        shell: bash
        run: |
          set -euo pipefail
          tag='save/2026-09-09-before-flashcard-auto-audio'
          target='60a23a0273c8e132aa37609705cae5934db734f0'
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
