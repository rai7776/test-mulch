name: Apply vocabulary rich card UI

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/apply-vocab-rich-card-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-vocab-rich-card-ui.py
      - name: Check JavaScript syntax
        run: |
          node --check word-senses.js
          node --check study-center.js
          node --check flashcard-study.js
      - name: Check rich sense UI hooks
        run: |
          grep -q "global-vocabulary-card-memo-preview" word-senses.js
          grep -q "global-vocabulary-secondary-senses" word-senses.js
          grep -q "study-center-word-other-meanings" study-center.js
          grep -q "study-card-other-meanings" flashcard-study.js
          grep -q "study-center.css?v=8" index.html
          grep -q "study-center.js?v=9" index.html
          grep -q "word-senses.js?v=4" index.html
      - name: Commit changes
        run: |
          git config user.name "Smart Reader Automation"
          git config user.email "actions@users.noreply.github.com"
          git add word-senses.js study-center.js study-center.css index.html
          git commit -m "Refine vocabulary cards and Study sense display" || exit 0
          git push origin HEAD:feature/study-center
