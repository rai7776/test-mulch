name: Apply note structure arrows v1
on:
  push:
    branches:
      - feature/note-structure-arrows-v1-impl
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire relation arrows into note structure UI
        shell: python
        run: |
          from pathlib import Path

          core = Path('note-structure-ui-core.js')
          s = core.read_text(encoding='utf-8')
          old = """        const roots = resolveAnnotations(originalText, structure);\n        appendRange(sentence, String(originalText || ''), 0, String(originalText || '').length, roots);\n        return sentence;"""
          new = """        const roots = resolveAnnotations(originalText, structure);\n        sentence._smartReaderStructure = structure || null;\n        appendRange(sentence, String(originalText || ''), 0, String(originalText || '').length, roots);\n        return sentence;"""
          assert s.count(old) == 1, f'core render anchor count={s.count(old)}'
          core.write_text(s.replace(old, new, 1), encoding='utf-8')

          wrapper = Path('note-structure-ui.js')
          w = wrapper.read_text(encoding='utf-8')
          old_core = "loadScript('note-structure-ui-core.js?v=1.4', 'note-structure-ui-core-loader');"
          new_core = "loadScript('note-structure-ui-core.js?v=1.5', 'note-structure-ui-core-loader');"
          assert w.count(old_core) == 1, 'core cache marker missing'
          w = w.replace(old_core, new_core, 1)
          arrow_line = "    loadScript('note-structure-arrows.js?v=1', 'note-structure-arrows-loader');\n"
          assert 'note-structure-arrows-loader' not in w, 'arrow loader already present'
          w = w.replace(new_core + '\n', new_core + '\n' + arrow_line, 1)
          wrapper.write_text(w, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          old_wrapper = '<script src="note-structure-ui.js?v=1.4"></script>'
          new_wrapper = '<script src="note-structure-ui.js?v=1.5"></script>'
          assert h.count(old_wrapper) == 1, f'wrapper cache marker count={h.count(old_wrapper)}'
          index.write_text(h.replace(old_wrapper, new_wrapper, 1), encoding='utf-8')
      - name: Validate
        run: |
          node --check note-structure-ui-core.js
          node --check note-structure-ui.js
          node --check note-structure-arrows.js
          grep -q 'sentence._smartReaderStructure = structure || null' note-structure-ui-core.js
          grep -q "note-structure-ui-core.js?v=1.5" note-structure-ui.js
          grep -q "note-structure-arrows.js?v=1" note-structure-ui.js
          grep -q 'note-structure-ui.js?v=1.5' index.html
          grep -q 'relationGeometry' note-structure-arrows.js
          grep -q 'ResizeObserver' note-structure-arrows.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note-structure-ui-core.js note-structure-ui.js index.html note-structure-arrows.js
          if ! git diff --cached --quiet; then
            git commit -m "Render note structure relation arrows"
            git push
          fi
