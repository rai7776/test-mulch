name: Apply Study quick limit and activity calendar

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/apply-study-quick-limit-calendar.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-study-quick-limit-calendar.py
      - name: Check JavaScript syntax
        run: node --check study-center.js
      - name: Check Study quick limit and calendar
        run: |
          grep -q "smart-reader-study-center-settings-v1" study-center.js
          grep -q "data-edit-study-limit" study-center.js
          grep -q "data-open-activity-calendar" study-center.js
          grep -q "study-activity-calendar-overlay" study-center.js
          grep -q "study-center-calendar-grid" study-center.css
          grep -q "study-center.css?v=10" index.html
          grep -q "study-center.js?v=11" index.html
      - name: Commit changes
        run: |
          git config user.name "Smart Reader Automation"
          git config user.email "actions@users.noreply.github.com"
          git add study-center.js study-center.css index.html
          git commit -m "Add configurable Study limit and activity calendar" || exit 0
          git push origin HEAD:feature/study-center
