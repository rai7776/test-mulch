name: Apply balanced Study mobile stats

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/apply-study-stats-balanced-mobile.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0

      - name: Apply balanced stats patch
        run: python .github/scripts/patch-study-stats-balanced-mobile.py

      - name: Verify balanced mobile stats
        run: |
          set -euo pipefail
          node --check study-center.js
          grep -Fq '/* Study Center balanced mobile stats v7 */' study-center.css
          grep -Fq 'grid-template-columns:repeat(3,minmax(0,1fr))' study-center.css
          grep -Fq 'height:92px' study-center.css
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr))' study-center.css
          grep -Fq 'height:${height}%' study-center.js
          grep -Fq 'study-center.css?v=7' index.html
          grep -Fq 'study-center.js?v=7' index.html
          python - <<'PY'
          from pathlib import Path
          css = Path('study-center.css').read_text()
          marker = '/* Study Center balanced mobile stats v7 */'
          assert css.rfind(marker) > css.rfind('/* Study Center compact mobile stats v6 */')
          block = css[css.rfind(marker):]
          assert 'grid-template-columns:repeat(3,minmax(0,1fr))' in block
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in block
          assert 'height:92px' in block
          PY

      - name: Commit balanced stats UI
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add study-center.css study-center.js index.html
          git commit -m 'Balance Study statistics layout on mobile'
          git push origin HEAD:feature/study-center
