name: Discover one-off article smoke test

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Add one verified VOA article to Discover (default: preview only)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-smoke.yml'

permissions:
  contents: write

concurrency:
  group: discover-one-off-import
  cancel-in-progress: false

jobs:
  verify-article-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Decide whether to publish
        run: |
          set -euo pipefail
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            publish=$(jq -r '.inputs.publish // "false"' "$GITHUB_EVENT_PATH")
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH" | grep -Fq '[discover-publish-once]'; then
              publish=true
            fi
          fi
          if [ "$publish" != "true" ]; then publish=false; fi
          echo "PUBLISH=$publish" >> "$GITHUB_ENV"
          echo "Publish mode: $publish"
      - name: Fetch and validate an original VOA article
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen
          from bs4 import BeautifulSoup

          url = "https://learningenglish.voanews.com/a/learning-english-with-english-clubs-starting-and-organizing-your-club/3947928.html"
          request = Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; SmartReader/1.0)"})
          with urlopen(request, timeout=20) as response:
              assert response.geturl().split("?")[0] == url, "Unexpected redirect"
              raw = response.read(2_000_001)
              assert len(raw) <= 2_000_000, "HTML too large"
          soup = BeautifulSoup(raw, "html.parser")
          heading = soup.select_one("h1")
          assert heading, "Article title not found"
          title = re.sub(r"\s+", " ", heading.get_text(" ", strip=True)).strip()
          assert title.casefold() == "learning english with english clubs", "Unexpected source article title"

          # Fixed article and verified date for this one-off test; no generalized feed importer yet.
          published = "2025-03-18"
          body = soup.select_one(".wsw")
          assert body is not None, "Known VOA article body container missing"
          paragraphs = []
          started = False
          credit_seen = False
          captions = {
              "Students participating in a university English club.",
              "Isidore Tine (right) teaches the English Club of Fandene, Senegal.",
              "A university English club, with their adviser."
          }
          for node in body.select("p"):
              text = re.sub(r"\s+", " ", node.get_text(separator="", strip=False)).strip()
              if not started:
                  if text.startswith("For many English learners, speaking is"):
                      started = True
                  else:
                      continue
              if not text:
                  continue
              if text.startswith("Hello readers!") or text.startswith("Words in This Story"):
                  break
              if node.find_parent(("figure", "figcaption")) or text in captions:
                  continue
              if "No media source currently available" in text:
                  continue
              if re.search(r"\b(Reuters|Associated Press|Agence France-Presse|AFP|Getty Images|Shutterstock)\b", text, re.I):
                  raise RuntimeError("Third-party agency credit detected")
              paragraphs.append(text)
              if re.search(r"Phil Dierking.*wrote this story for VOA Learning English", text, re.I):
                  credit_seen = True
                  break

          assert started and credit_seen, "Source article boundaries or VOA production credit missing"
          content = "\n\n".join(paragraphs)
          words = len(re.findall(r"\b[A-Za-z]+(?:[’'-][A-Za-z]+)*\b", content))
          assert len(paragraphs) >= 25 and 800 <= words <= 1500, f"Extraction suspicious: {len(paragraphs)} paragraphs / {words} words"
          for excluded in ("No media source currently available", "Hello readers!", "Words in This Story",
                           "advantage - n.", "Students participating in a university English club."):
              assert excluded not in content, f"Non-article text detected: {excluded}"

          article = {
              "id": "voa-original-3947928",
              "type": "Articles",
              "genres": ["Culture", "Society"],
              "tags": [],
              "difficulty": "中級",
              "minutes": max(1, (words + 179) // 180),
              "publishedAt": published,
              "title": title,
              "content": content,
              "language": "en",
              "descriptions": {"en": "Practical advice on starting and running an English conversation club."},
              "sourceName": "VOA Learning English",
              "sourceUrl": url,
              "licenseUrl": "https://learningenglish.voanews.com/p/6861.html",
              "contentType": "original",
              "wordCount": words
          }
          catalog_path = Path("discover-data/index.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          assert catalog["version"] == 1 and article["type"] in catalog["types"], "Schema mismatch"
          assert set(article["genres"]).issubset(set(catalog["genres"])), "Invalid genres"
          assert isinstance(catalog["articles"], list), "Articles must be a list"
          existing = catalog["articles"]
          duplicate = any(
              old.get("id") == article["id"]
              or old.get("sourceUrl") == article["sourceUrl"]
              or old.get("title", "").strip().casefold() == article["title"].casefold()
              for old in existing
          )
          preview_path = Path("/tmp/discover-smoke-preview.json")
          preview_path.write_text(json.dumps(article, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"PASS: {title}; {words} words, {len(paragraphs)} paragraphs; credit verified")
          report = [
              f"PASS: {title}",
              f"Words: {words}; paragraphs: {len(paragraphs)}",
              "Verified publisher: VOA Learning English (original production)",
              "Excluded audio UI, images, glossary and postscript.",
              "English sentences not rewritten.",
          ]
          if duplicate:
              report.append("SKIPPED: Already in Discover (URL/ID/title deduplication).")
          elif os.environ.get("PUBLISH") == "true":
              catalog["articles"].append(article)
              assert len({item["id"] for item in catalog["articles"]}) == len(catalog["articles"]), "Duplicate ID"
              catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              report.append("APPENDED: one original VOA article to discover-data/index.json")
          else:
              report.append("DRY RUN: no repository changes")
          print("\n".join(report))
          Path("/tmp/discover-smoke-report.txt").write_text("\n".join(report) + "\n", encoding="utf-8")
          PY
      - name: Commit approved article to main
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ]; then
            echo 'Preview mode; no commit.'
            exit 0
          fi
          git add discover-data/index.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit (probably duplicate).'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content(discover): import one original VOA article'
          git push origin HEAD:main
          echo 'Article committed. GitHub Pages branch deployment may need a separate trigger.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report import result
        if: success()
        run: |
          echo '### Discover article import' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/discover-smoke-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload extracted original article
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-smoke-preview
          path: /tmp/discover-smoke-preview.json
          if-no-files-found: ignore
