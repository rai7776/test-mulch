name: Discover one-off article smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-smoke.yml'

permissions:
  contents: read

jobs:
  verify-article-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Fetch, parse, and validate one public-domain VOA original
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          from bs4 import BeautifulSoup, Tag
          url = 'https://learningenglish.voanews.com/a/learning-english-with-english-clubs-starting-and-organizing-your-club/3947928.html'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=20) as response:
              assert response.geturl().startswith('https://learningenglish.voanews.com/a/'), 'Unexpected redirect'
              html = response.read(2_000_001)
              assert len(html) <= 2_000_000, 'Article too large'
          soup = BeautifulSoup(html, 'html.parser')
          title = soup.select_one('h1')
          assert title, 'Missing title'
          candidates = [(selector, node) for selector in ('.wsw', '.article-body', '.article-content', '[itemprop=articleBody]') for node in soup.select(selector) if node.find('p')]
          body = max((node for _, node in candidates), key=lambda n: len(n.select('p')), default=None)
          assert body, 'Article body missing'
          paras = []
          for n in body.descendants:
              if not isinstance(n, Tag):
                  continue
              if n.name in ('h2','h3') and 'words in this story' in n.get_text(' ', strip=True).lower():
                  break
              if n.name != 'p' or n.find_parent(('p','figure','figcaption')):
                  continue
              if n.find_parent(class_=re.compile('caption|image|photo|related', re.I)):
                  continue
              paragraph = re.sub(r'\s+', ' ', n.get_text('', strip=False)).strip()
              if paragraph and paragraph not in paras[-2:]:
                  paras.append(paragraph)
          content = '\n\n'.join(paras)
          words = len(re.findall(r"\b[A-Za-z]+(?:[’'-][A-Za-z]+)*\b", content))
          assert len(paras) >= 5 and 300 <= words <= 1800, f'Extraction suspicious: {len(paras)} paragraphs, {words} words'
          assert re.search(r'wrote this story for VOA Learning English', content, re.I), 'Original VOA attribution not found'
          assert not re.search(r'\b(Reuters|Associated Press|Agence France-Presse|AFP|Getty Images|Shutterstock)\b', content, re.I), 'Third-party text may be included'
          data = json.loads(Path('discover-data/index.json').read_text())
          assert data['version'] == 1 and 'Articles' in data['types'], 'Discover schema mismatch'
          preview = {'title': title.get_text(' ', strip=True), 'sourceUrl': url, 'publishedAt': '2025-03-18', 'content': content, 'wordCount': words, 'note': 'Dry run only. No JSON changes; no site deployment.'}
          Path('/tmp/discover-smoke-preview.json').write_text(json.dumps(preview, indent=2, ensure_ascii=False))
          print(f"PASS: {preview['title']} / {words} words / {len(paras)} paragraphs")
          print('Original English preserved; paragraphs and whitespace normalized.')
          with open('/tmp/discover-smoke-report.txt', 'w') as report:
              report.write(f"PASS: {preview['title']} / {words} words / {len(paras)} paragraphs\n")
          PY
      - name: Report smoke-test result
        if: success()
        run: |
          echo '### Discover article smoke test' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/discover-smoke-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'No article was committed; this is a one-off safe test.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save result as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-smoke-preview
          path: /tmp/discover-smoke-preview.json
          if-no-files-found: ignore
