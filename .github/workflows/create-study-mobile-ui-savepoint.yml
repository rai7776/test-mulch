name: Create Study mobile UI savepoint

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/create-study-mobile-ui-savepoint.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create savepoint
        run: |
          set -euo pipefail
          tag='save/2026-09-15-before-study-mobile-ui'
          target='948e9c822e6f0555e9eeba14e09f33355ca71e3d'
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$target"
