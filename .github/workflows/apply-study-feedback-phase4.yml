name: Apply Study Center feedback phase

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/apply-study-feedback-phase4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0

      - name: Apply feedback phase patch
        run: python .github/scripts/patch-study-feedback-phase4.py

      - name: Verify
        run: |
          set -euo pipefail
          node --check flashcard-study.js
          node --check study-center.js
          grep -Fq 'study-answer-feedback' flashcard-study.js
          grep -Fq 'bestStreak' flashcard-study.js
          grep -Fq 'weakCleared' flashcard-study.js
          grep -Fq 'flashcard-study.js?v=1.7' index.html
          grep -Fq 'study-center.js?v=4' index.html

      - name: Commit feedback phase
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add flashcard-study.js study-center.js index.html STUDY_CENTER_PLAN.md
          git commit -m 'Add rewarding Study Center answer feedback'
          git push origin HEAD:feature/study-center
