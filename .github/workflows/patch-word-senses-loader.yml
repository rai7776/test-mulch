name: Patch word senses loader
on:
  push:
    branches:
      - feature/word-senses-v1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '    <script src="note-structure-ui.js?v=2.2"></script>\n'
          new = old + '    <script src="word-senses.js?v=1"></script>\n'
          if 'word-senses.js?v=1' not in s:
              if old not in s:
                  raise SystemExit('note structure loader marker not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check word-senses.js
          grep -q 'word-senses.js?v=1' index.html
          grep -q 'contextSenseId' word-senses.js
          grep -q '既存の意味から追加' word-senses.js
          grep -q 'global-vocabulary-senses-summary' word-senses.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html word-senses.js
          git commit -m 'Load multiple word meaning UI'
          git push
