name: Apply mobile flashcard swipe fix

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/apply-flashcard-swipe-mobile-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch-flashcard-swipe-mobile.py

      - name: Verify
        run: |
          set -euo pipefail
          node --check flashcard-study.js
          grep -Fq 'const isQuickFlick = distance >= 34 && velocity >= 0.28;' flashcard-study.js
          grep -Fq 'flashcard-study.js?v=1.8' index.html

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add flashcard-study.js index.html
          git commit -m 'Fix quick flashcard swipes on mobile Safari'
          git push origin HEAD:feature/study-center
