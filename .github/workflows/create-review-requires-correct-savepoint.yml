name: Create review completion savepoint

on:
  push:
    branches: [fix/review-requires-correct]
    paths:
      - '.github/workflows/create-review-requires-correct-savepoint.yml'

permissions:
  contents: write

jobs:
  savepoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create stable save tag
        shell: bash
        run: |
          set -euo pipefail
          tag='save/2026-09-10-before-review-requires-correct'
          target='32117b2d51b0868796632646ee05824a3a4c8743'
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
