name: Apply word modal rich layout

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/apply-word-modal-rich-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-word-modal-rich-layout.py
      - name: Check JavaScript syntax
        run: |
          node --check word-senses.js
          node --check flashcard-study.js
          node --check study-center.js
      - name: Check rich modal and Study hooks
        run: |
          grep -q "word-modal-hero" word-senses.js
          grep -q "word-modal-memo-block" word-senses.js
          grep -q "study-center-history-meaning-stack" study-center.js
          grep -q "otherMeanings: \[...senseDisplay.otherMeanings\]" flashcard-study.js
          grep -q "flashcard-study.js?v=1.14" index.html
          grep -q "study-center.css?v=9" index.html
          grep -q "study-center.js?v=10" index.html
          grep -q "word-senses.js?v=5" index.html
      - name: Commit changes
        run: |
          git config user.name "Smart Reader Automation"
          git config user.email "actions@users.noreply.github.com"
          git add word-senses.js flashcard-study.js study-center.js study-center.css index.html
          git commit -m "Redesign word modal and extend Study meanings" || exit 0
          git push origin HEAD:feature/study-center
