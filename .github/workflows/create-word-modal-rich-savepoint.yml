name: Create word modal rich layout savepoint

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/create-word-modal-rich-savepoint.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create savepoint tag
        run: |
          tag="save/2026-09-16-before-word-modal-rich-layout"
          target="ae35314325685aa339fd9a2e26bb44baef2ced06"
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
