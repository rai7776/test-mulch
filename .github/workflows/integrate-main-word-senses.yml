name: Integrate main word senses into Study

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/integrate-main-word-senses.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0

      - name: Fetch main and create savepoint tag
        run: |
          set -euo pipefail
          git fetch origin main --tags
          tag='save/2026-09-15-before-study-word-senses-integration'
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag" origin/main
            git push origin "refs/tags/$tag"
          fi

      - name: Merge latest main
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-edit -X ours origin/main

      - name: Apply Study compatibility patch
        run: python .github/scripts/patch-study-word-senses-integration.py

      - name: Verify integration
        run: |
          set -euo pipefail
          test -f word-senses.js
          node --check word-senses.js
          node --check flashcard-study.js
          node --check study-center.js
          grep -Fq 'word-senses.js?v=1' index.html
          grep -Fq 'flashcard-study.js?v=1.12' index.html
          grep -Fq 'study-center.js?v=8' index.html
          grep -Fq 'function resolveStudyMeaning(word)' flashcard-study.js
          grep -Fq 'getWordMeaning: word => resolveStudyMeaning(word)' flashcard-study.js
          grep -Fq 'meaning: resolveStudyMeaning(entry.word)' flashcard-study.js
          grep -Fq "const meaning = resolveStudyMeaning(word) || '意味未登録';" flashcard-study.js
          grep -Fq 'function studyMeaning(word)' study-center.js
          grep -Fq 'escapeHtml(studyMeaning(entry.word))' study-center.js
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          assert html.count('word-senses.js?v=1') == 1
          flash = Path('flashcard-study.js').read_text()
          assert "meaning: String(entry.word.meaning || '')" not in flash
          assert "const meaning = String(word.meaning || '').trim() || '意味未登録';" not in flash
          study = Path('study-center.js').read_text()
          assert 'escapeHtml(entry.word.meaning || \'\')' not in study
          PY

      - name: Commit and push integration
        run: |
          set -euo pipefail
          git add index.html word-senses.js flashcard-study.js study-center.js
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate shared vocabulary senses with Study'
          fi
          git push origin HEAD:feature/study-center
