name: Patch note occurrence UI
on:
  push:
    branches:
      - feature/note-structure-occurrence-ui
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch occurrence UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('note-structure-editor.js')
          s = p.read_text(encoding='utf-8')

          marker = "    function addCore(label) {\n"
          helper = """    function countOccurrences(source, needle) {\n        const text = String(source || '');\n        const target = String(needle || '').trim();\n        if (!target) return 0;\n        let count = 0;\n        let from = 0;\n        while (from <= text.length - target.length) {\n            const found = text.indexOf(target, from);\n            if (found < 0) break;\n            count += 1;\n            from = found + Math.max(1, target.length);\n        }\n        return count;\n    }\n\n"""
          if marker not in s:
              raise SystemExit('addCore marker not found')
          s = s.replace(marker, helper + marker, 1)

          old_listener = "        textInput.addEventListener('input', () => { row.text = textInput.value; state.dirty = true; updatePreview(); });\n\n"
          new_listener = "        textInput.addEventListener('input', () => { row.text = textInput.value; syncOccurrenceControl(); state.dirty = true; updatePreview(); });\n\n"
          if old_listener not in s:
              raise SystemExit('text input listener marker not found')
          s = s.replace(old_listener, new_listener, 1)

          old_occurrence = """        const occurrence = document.createElement('input');\n        occurrence.type = 'number'; occurrence.min = '1'; occurrence.step = '1';\n        occurrence.className = 'note-structure-editor-occurrence';\n        occurrence.title = '原文内で何回目に現れる語句か';\n        occurrence.value = String(row.occurrence || 1);\n        occurrence.addEventListener('input', () => { row.occurrence = Math.max(1, Number(occurrence.value) || 1); state.dirty = true; updatePreview(); });\n\n"""
          new_occurrence = """        const occurrenceWrap = document.createElement('label');\n        occurrenceWrap.className = 'note-structure-editor-occurrence-wrap';\n        const occurrenceCaption = document.createElement('span');\n        occurrenceCaption.textContent = '出現位置';\n        const occurrenceSelect = document.createElement('select');\n        occurrenceSelect.className = 'note-structure-editor-occurrence';\n        occurrenceSelect.setAttribute('aria-label', '原文中の出現位置');\n        occurrenceWrap.append(occurrenceCaption, occurrenceSelect);\n\n        function syncOccurrenceControl() {\n            const source = String(document.getElementById('input-note-eng')?.value || '');\n            const total = countOccurrences(source, row.text);\n            occurrenceSelect.replaceChildren();\n            if (total <= 1) {\n                row.occurrence = 1;\n                occurrenceWrap.hidden = true;\n                return;\n            }\n            occurrenceWrap.hidden = false;\n            const current = Math.min(total, Math.max(1, Number(row.occurrence) || 1));\n            row.occurrence = current;\n            for (let n = 1; n <= total; n += 1) {\n                const option = document.createElement('option');\n                option.value = String(n);\n                option.textContent = `${n}回目 / ${total}`;\n                occurrenceSelect.appendChild(option);\n            }\n            occurrenceSelect.value = String(current);\n        }\n        occurrenceSelect.addEventListener('change', () => {\n            row.occurrence = Math.max(1, Number(occurrenceSelect.value) || 1);\n            state.dirty = true;\n            updatePreview();\n        });\n        syncOccurrenceControl();\n\n"""
          if old_occurrence not in s:
              raise SystemExit('occurrence block marker not found')
          s = s.replace(old_occurrence, new_occurrence, 1)

          old_append = "        top.append(kind, textInput, occurrence, remove);\n"
          new_append = "        top.append(kind, textInput, remove);\n"
          if old_append not in s:
              raise SystemExit('top append marker not found')
          s = s.replace(old_append, new_append, 1)

          old_options_end = """        } else {\n            const note = document.createElement('span'); note.textContent = '将来の矢印用接続点。現在は表示されません。'; options.appendChild(note);\n        }\n        card.appendChild(options);\n"""
          new_options_end = """        } else {\n            const note = document.createElement('span'); note.textContent = '将来の矢印用接続点。現在は表示されません。'; options.appendChild(note);\n        }\n        options.appendChild(occurrenceWrap);\n        card.appendChild(options);\n"""
          if old_options_end not in s:
              raise SystemExit('options end marker not found')
          s = s.replace(old_options_end, new_options_end, 1)

          old_help = "                    <p class=\"note-structure-editor-help\">原文欄で語句を選択してから追加すると自動入力されます。V'・S1などは追加後に変更できます。</p>"
          new_help = "                    <p class=\"note-structure-editor-help\">原文欄で語句を選択してから追加すると自動入力されます。V'・S1などは追加後に変更できます。同じ語句が原文に複数ある場合だけ「出現位置」が表示されます。</p>"
          if old_help not in s:
              raise SystemExit('help text marker not found')
          s = s.replace(old_help, new_help, 1)

          old_original_listener = "        document.getElementById('input-note-eng')?.addEventListener('input', updatePreview);\n"
          new_original_listener = "        document.getElementById('input-note-eng')?.addEventListener('input', renderRows);\n"
          if old_original_listener not in s:
              raise SystemExit('original input listener marker not found')
          s = s.replace(old_original_listener, new_original_listener, 1)

          old_grid = "            .note-structure-editor-row-top { display: grid; grid-template-columns: minmax(86px, .8fr) minmax(130px, 2fr) 58px 34px; gap: 6px; align-items: center; }"
          new_grid = "            .note-structure-editor-row-top { display: grid; grid-template-columns: minmax(86px, .8fr) minmax(130px, 2fr) 34px; gap: 6px; align-items: center; }"
          if old_grid not in s:
              raise SystemExit('desktop grid marker not found')
          s = s.replace(old_grid, new_grid, 1)

          old_occ_css = "            .note-structure-editor-occurrence { text-align: center; }\n"
          new_occ_css = """            .note-structure-editor-occurrence-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; white-space: nowrap; color: #67727d; }\n            .note-structure-editor-occurrence-wrap[hidden] { display: none !important; }\n            .note-structure-editor-occurrence-wrap select { width: auto; min-width: 104px; }\n"""
          if old_occ_css not in s:
              raise SystemExit('occurrence css marker not found')
          s = s.replace(old_occ_css, new_occ_css, 1)

          old_mobile = "                .note-structure-editor-row-top { grid-template-columns: 92px minmax(0, 1fr) 54px 34px; }"
          new_mobile = "                .note-structure-editor-row-top { grid-template-columns: 92px minmax(0, 1fr) 34px; }\n                .note-structure-editor-occurrence-wrap { width: 100%; justify-content: flex-start; margin-left: 0; }"
          if old_mobile not in s:
              raise SystemExit('mobile grid marker not found')
          s = s.replace(old_mobile, new_mobile, 1)

          export_marker = "        validate,\n        buildStructure,\n"
          if export_marker in s:
              s = s.replace(export_marker, "        validate,\n        buildStructure,\n        countOccurrences,\n", 1)

          p.write_text(s, encoding='utf-8')
          PY
          node --check note-structure-editor.js
          grep -q "同じ語句が原文に複数ある場合だけ" note-structure-editor.js
          grep -q "occurrenceWrap.hidden = true" note-structure-editor.js
          grep -q "option.textContent = .*回目 /" note-structure-editor.js
          ! grep -q "occurrence.type = 'number'" note-structure-editor.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note-structure-editor.js
          if ! git diff --cached --quiet; then
            git commit -m "Clarify note structure occurrence UI"
            git push
          fi
