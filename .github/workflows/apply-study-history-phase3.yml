name: Apply Study Center history phase

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/apply-study-history-phase3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0

      - name: Apply history phase patch
        run: python .github/scripts/patch-study-history-phase3.py

      - name: Verify
        run: |
          set -euo pipefail
          node --check flashcard-study.js
          node --check study-center.js
          grep -Fq 'study_history_v1' flashcard-study.js
          grep -Fq 'renderHistory' study-center.js
          grep -Fq 'renderStats' study-center.js
          grep -Fq 'study-center.js?v=3' index.html
          grep -Fq 'flashcard-study.js?v=1.6' index.html

      - name: Commit history phase
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add flashcard-study.js study-center.js study-center.css index.html STUDY_CENTER_PLAN.md
          git commit -m 'Add Study Center learning history and statistics'
          git push origin HEAD:feature/study-center
