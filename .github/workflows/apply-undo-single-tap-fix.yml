name: Apply undo single tap fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-undo-single-tap-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create savepoint
        shell: bash
        run: |
          set -euo pipefail
          tag='save/2026-09-10-before-undo-single-tap-fix'
          target='e70461b82de2b8a807c31f2b2189001f1427ad1a'
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"

      - name: Patch undo flow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('flashcard-study.js')
          text = path.read_text()

          old_sig = "    function answerCurrent(result) {"
          new_sig = "    function answerCurrent(result, { deferRender = false } = {}) {"
          if old_sig not in text:
              raise SystemExit('answerCurrent signature anchor not found')
          text = text.replace(old_sig, new_sig, 1)

          old_tail = "\n".join([
              "        scheduleSave();",
              "        refreshStudySurfaces();",
              "        renderSession();",
              "    }",
              "",
              "    function undoLast() {",
              "        if (!session) return;",
              "",
              "        if (pendingCommit) {",
              "            clearTimeout(pendingCommit.timerId);",
              "            pendingCommit = null;",
              "            resetCardPosition(document.getElementById('study-flashcard'));",
              "            renderSessionHeader();",
              "            return;",
              "        }",
              "",
              "        if (!session.history.length) return;",
              "        const snapshot = session.history.pop();",
              "        restoreSnapshot(snapshot);",
              "        renderSession();",
              "        refreshStudySurfaces();",
              "    }",
          ])
          new_tail = "\n".join([
              "        scheduleSave();",
              "        if (!deferRender) {",
              "            refreshStudySurfaces();",
              "            renderSession();",
              "        }",
              "    }",
              "",
              "    function undoLast() {",
              "        if (!session) return;",
              "",
              "        if (pendingCommit) {",
              "            clearTimeout(pendingCommit.timerId);",
              "            pendingCommit = null;",
              "        }",
              "",
              "        if (!session.history.length) {",
              "            resetCardPosition(document.getElementById('study-flashcard'));",
              "            renderSessionHeader();",
              "            return;",
              "        }",
              "        const snapshot = session.history.pop();",
              "        restoreSnapshot(snapshot);",
              "        renderSession();",
              "        refreshStudySurfaces();",
              "    }",
          ])
          if old_tail not in text:
              raise SystemExit('answerCurrent/undoLast block anchor not found')
          text = text.replace(old_tail, new_tail, 1)

          old_commit = "\n".join([
              "        const timerId = window.setTimeout(() => {",
              "            if (!pendingCommit || pendingCommit.timerId !== timerId) return;",
              "            pendingCommit = null;",
              "            answerCurrent(result);",
              "        }, 190);",
              "        pendingCommit = { result, timerId };",
              "        renderSessionHeader();",
          ])
          new_commit = "\n".join([
              "        // Record the judgement immediately so undo always has one history item to restore.",
              "        // Only the visual transition to the next card is delayed.",
              "        answerCurrent(result, { deferRender: true });",
              "",
              "        const timerId = window.setTimeout(() => {",
              "            if (!pendingCommit || pendingCommit.timerId !== timerId) return;",
              "            pendingCommit = null;",
              "            refreshStudySurfaces();",
              "            renderSession();",
              "        }, 190);",
              "        pendingCommit = { result, timerId };",
              "        const undo = document.getElementById('study-session-undo');",
              "        if (undo) undo.disabled = false;",
          ])
          if old_commit not in text:
              raise SystemExit('commitResult anchor not found')
          text = text.replace(old_commit, new_commit, 1)
          path.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          old_version = 'flashcard-study.js?v=1.2'
          new_version = 'flashcard-study.js?v=1.3'
          if old_version not in html:
              raise SystemExit('flashcard cache version anchor not found')
          index.write_text(html.replace(old_version, new_version, 1))
          PY

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check flashcard-study.js
          grep -Fq 'function answerCurrent(result, { deferRender = false } = {})' flashcard-study.js
          grep -Fq 'answerCurrent(result, { deferRender: true })' flashcard-study.js
          grep -Fq 'flashcard-study.js?v=1.3' index.html

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add flashcard-study.js index.html
          git commit -m 'Make flashcard undo work with one tap'
          git push origin HEAD:main
