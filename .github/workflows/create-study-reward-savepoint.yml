name: Create study reward savepoint

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/create-study-reward-savepoint.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create savepoint tag
        run: |
          tag="save/2026-09-16-before-study-reward-details"
          target="f008d16f4963d7732b5e0b278b4c2b499f234fbc"
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
