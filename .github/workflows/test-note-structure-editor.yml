name: Test note structure editor
on:
  push:
    branches:
      - feature/note-structure-editor
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check note-structure-editor.js
          node --check note-structure-ui.js
      - name: Contract checks
        run: |
          grep -q "loadScript('note-structure-editor.js?v=1'" note-structure-ui.js
          ! grep -q "loadScript('note-structure-arrows.js" note-structure-ui.js
          grep -q "base.relations.filter" note-structure-editor.js
          grep -q "buildStructureSentence" note-structure-editor.js
          grep -q "window.handleUnifiedSave = wrapped" note-structure-editor.js
          grep -q "data-add-core=\"S\"" note-structure-editor.js
          grep -q "data-add-modifier" note-structure-editor.js
