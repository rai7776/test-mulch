name: Finalize adaptive flashcards
on:
  push:
    branches:
      - feature/adaptive-flashcard-review
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tighten lapse definition
        run: python .github/scripts/finalize-adaptive-flashcards.py
      - name: Validate syntax
        run: node --check flashcard-study.js
      - name: Run behavior tests
        run: node .github/scripts/test-adaptive-flashcards.js
      - name: Commit final logic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flashcard-study.js
          git commit -m "Refine adaptive flashcard lapse handling" || true
          git push
