name: Apply Study summary mobile fix

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/apply-study-summary-mobile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-study-summary-mobile.py
      - name: Check JavaScript syntax
        run: |
          node --check flashcard-study.js
          node --check study-reward-ui.js
      - name: Protect stable answer path
        run: |
          python - <<'PY'
          import re, subprocess
          before = subprocess.check_output(['git','show','save/2026-09-16-before-study-reward-details:flashcard-study.js'], text=True)
          after = open('flashcard-study.js').read()
          def fn(text, name):
              m = re.search(rf'^    function {name}\([^\n]*\) \{{', text, re.M)
              if not m: raise SystemExit(f'missing {name}')
              start = m.start()
              nxt = re.search(r'^    function [A-Za-z0-9_]+\(', text[m.end():], re.M)
              end = m.end()+nxt.start() if nxt else len(text)
              return text[start:end].strip()
          assert fn(before, 'answerCurrent') == fn(after, 'answerCurrent'), 'answerCurrent changed'
          assert '}, 190);' in after
          PY
      - name: Check summary fixes
        run: |
          grep -q "mode === 'unsure'" flashcard-study.js
          grep -q "？をもう一度" study-reward-ui.js
          grep -q "？と×両方" study-reward-ui.js
          grep -q "study-summary-active" study-reward-ui.js
          grep -q "study-summary-mode" study-reward-ui.js
          grep -q "flashcard-study.js?v=1.16" index.html
          grep -q "study-reward-ui.js?v=2" index.html
      - name: Commit changes
        run: |
          git config user.name "Smart Reader Automation"
          git config user.email "actions@users.noreply.github.com"
          git add flashcard-study.js study-reward-ui.js index.html
          git commit -m "Fix mobile Study summary layout" || exit 0
          git push origin HEAD:feature/study-center
