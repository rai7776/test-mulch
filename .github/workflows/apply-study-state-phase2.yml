name: Apply Study Center phase 2

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/apply-study-state-phase2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0

      - name: Apply phase 2 patch
        run: python .github/scripts/patch-study-state-phase2.py

      - name: Verify JavaScript
        run: |
          set -euo pipefail
          node --check flashcard-study.js
          node --check study-center.js
          node --check folder-study-range.js
          grep -Fq 'manualMasteredAt' flashcard-study.js
          grep -Fq 'data-toggle-hold' study-center.js
          grep -Fq 'study-center.js?v=2' index.html
          grep -Fq 'flashcard-study.js?v=1.5' index.html

      - name: Commit phase 2
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add flashcard-study.js study-center.js study-center.css folder-study-range.js index.html STUDY_CENTER_PLAN.md
          git commit -m 'Add Study Center learning states and weakness model'
          git push origin HEAD:feature/study-center
