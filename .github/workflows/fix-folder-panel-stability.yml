name: Fix folder panel stability
on:
  push:
    branches:
      - fix/folder-panel-stability
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chapter scope guard
        shell: python
        run: |
          from pathlib import Path
          p=Path('chapter-scope-ui.js')
          s=p.read_text(encoding='utf-8')
          old="function rerender(){ if(currentArticle&&scopedTypes.has(currentTab)) scopedRenderList(currentTab,document.getElementById('list-search')?.value||''); }"
          new="function isFolderPanelMode(){ const panel=document.getElementById('side-panel'); return !!panel&&panel.classList.contains('folder-panel-mode'); }\nfunction rerender(){ if(isFolderPanelMode()) return; if(currentArticle&&scopedTypes.has(currentTab)) scopedRenderList(currentTab,document.getElementById('list-search')?.value||''); }"
          assert old in s, 'rerender marker missing'
          s=s.replace(old,new,1)
          old="function scopedRenderList(type,filter=''){ if(state.rendering) return originalRenderList(type,filter);"
          new="function scopedRenderList(type,filter=''){ if(isFolderPanelMode()) return originalRenderList(type,filter); if(state.rendering) return originalRenderList(type,filter);"
          assert old in s, 'scopedRenderList marker missing'
          s=s.replace(old,new,1)
          old="function updateControls(type){ const el=document.getElementById('chapter-scope-controls'); if(!el) return;"
          new="function updateControls(type){ const el=document.getElementById('chapter-scope-controls'); if(!el) return; if(isFolderPanelMode()){el.hidden=true;return;}"
          assert old in s, 'updateControls marker missing'
          s=s.replace(old,new,1)
          old="if(panel.classList.contains('is-open')){ const sig=signature();"
          new="if(panel.classList.contains('is-open')&&!isFolderPanelMode()){ const sig=signature();"
          assert old in s, 'observer marker missing'
          s=s.replace(old,new,1)
          old="setInterval(()=>{ if(state.rendering||!currentArticle||state.scope!=='chapter'||!scopedTypes.has(currentTab)) return;"
          new="setInterval(()=>{ if(isFolderPanelMode()) return; if(state.rendering||!currentArticle||state.scope!=='chapter'||!scopedTypes.has(currentTab)) return;"
          assert old in s, 'interval marker missing'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          node --check chapter-scope-ui.js
          node --check folder-panel-context.js
          grep -q 'isFolderPanelMode' chapter-scope-ui.js
          grep -q "classList.contains('folder-panel-mode')" chapter-scope-ui.js
          grep -q "if(isFolderPanelMode()) return" chapter-scope-ui.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapter-scope-ui.js
          git commit -m "Prevent chapter scope from overriding folder panels" || true
          git push
