name: Create folder study ratio savepoint

on:
  push:
    branches: [feature/folder-study-priority-ratio]
    paths:
      - '.github/workflows/create-folder-study-ratio-savepoint.yml'

permissions:
  contents: write

jobs:
  savepoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create stable save tag
        shell: bash
        run: |
          set -euo pipefail
          tag='save/2026-09-10-before-folder-study-priority-70-25-5'
          target='66245fee26a6606a3b40c31db5ae3ba9f5895814'
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
