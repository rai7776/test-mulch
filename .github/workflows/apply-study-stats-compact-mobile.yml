name: Apply compact Study mobile stats

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/apply-study-stats-compact-mobile.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0

      - name: Apply compact stats patch
        run: python .github/scripts/patch-study-stats-compact-mobile.py

      - name: Verify compact mobile stats
        run: |
          set -euo pipefail
          node --check study-center.js
          grep -Fq '/* Study Center compact mobile stats v6 */' study-center.css
          grep -Fq 'grid-template-columns:repeat(4,minmax(0,1fr))' study-center.css
          grep -Fq 'min-height:56px' study-center.css
          grep -Fq 'height:62px' study-center.css
          grep -Fq 'study-center.css?v=6' index.html
          python - <<'PY'
          from pathlib import Path
          css = Path('study-center.css').read_text()
          marker = '/* Study Center compact mobile stats v6 */'
          assert css.rfind(marker) > css.rfind('/* Study Center mobile scroll v5 */')
          block = css[css.rfind(marker):]
          assert '.study-center-stats .study-center-stat-grid small{display:none}' in block
          assert block.count('grid-template-columns:repeat(4,minmax(0,1fr))') >= 2
          PY

      - name: Commit compact stats UI
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add study-center.css index.html
          git commit -m 'Compact Study statistics on mobile'
          git push origin HEAD:feature/study-center
