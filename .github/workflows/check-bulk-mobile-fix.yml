name: Check bulk mobile fix
on:
  push:
    branches:
      - fix/bulk-import-mobile-ui
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load mobile fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '    <script src="bulk-import.js?v=1.0"></script>\n'
          new = old + '    <script src="bulk-import-mobile-fix.js?v=1.0"></script>\n'
          if 'bulk-import-mobile-fix.js' not in s:
              if old not in s:
                  raise SystemExit('bulk-import script tag not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check bulk-import.js
          node --check bulk-import-mobile-fix.js
          grep -q 'bulk-import-mobile-fix.js?v=1.0' index.html
          grep -q 'handlePromptCopy' bulk-import-mobile-fix.js
          grep -q 'legacyCopy' bulk-import-mobile-fix.js
          grep -q '長押しして「ペースト」' bulk-import-mobile-fix.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load bulk import mobile fixes"
          git push
