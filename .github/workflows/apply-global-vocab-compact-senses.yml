name: Apply Global Vocabulary compact cards

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/apply-global-vocab-compact-senses.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0
      - name: Apply compact card patch
        run: python .github/scripts/patch-global-vocab-compact.py
      - name: Check JavaScript syntax
        run: node --check word-senses.js
      - name: Verify compact-card behavior
        run: |
          grep -q "if (!display.others.length)" word-senses.js
          grep -q "meaning.textContent = display.context.meaning" word-senses.js
          grep -q "global-vocabulary-secondary-senses" word-senses.js
          grep -q "word-senses.js?v=8" index.html
          if grep -q "global-vocabulary-card-memo-label" word-senses.js; then exit 1; fi
      - name: Commit changes
        run: |
          git config user.name "Smart Reader Automation"
          git config user.email "actions@users.noreply.github.com"
          git add word-senses.js index.html
          git commit -m "Compact Global Vocabulary meaning cards" || exit 0
          git push origin HEAD:feature/study-center
