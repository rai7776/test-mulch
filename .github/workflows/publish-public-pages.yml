name: Publish static public reading pages
on:
  push:
    branches: [main]
    paths:
      - 'discover-data/index.json'
      - 'public-pages-core.js'
      - 'scripts/generate-public-pages.js'
      - '.github/workflows/publish-public-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-public-pages-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate public article pages from reviewed catalog
        env:
          SITE_URL: ${{ vars.SMART_READER_SITE_URL }}
        run: node scripts/generate-public-pages.js
      - name: Commit generated public HTML if changed
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Public pages are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate public reading pages"
          git push origin HEAD:main
