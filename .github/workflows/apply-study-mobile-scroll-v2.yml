name: Apply Study mobile scroll v2

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/apply-study-mobile-scroll-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch-study-mobile-scroll-v2.py

      - name: Verify mobile scroll and width guards
        run: |
          set -euo pipefail
          node --check study-center.js
          grep -Fq '/* Study Center mobile scroll v5 */' study-center.css
          grep -Fq '#main-reader.study-center-active' study-center.css
          grep -Fq 'overflow-y:auto' study-center.css
          grep -Fq 'grid-template-columns:minmax(0,1fr) minmax(0,1fr) 38px' study-center.css
          grep -Fq "main?.classList.add('study-center-active')" study-center.js
          grep -Fq "classList.remove('study-center-active')" study-center.js
          grep -Fq 'study-center.css?v=5' index.html
          grep -Fq 'study-center.js?v=6' index.html
          python - <<'PY'
          from pathlib import Path
          css = Path('study-center.css').read_text()
          # The newest block must come after older mobile rules so it wins the cascade.
          assert css.rfind('/* Study Center mobile scroll v5 */') > css.rfind('/* Study Center mobile layout v4 */')
          assert css.rfind('.study-center-word-card{display:block!important}') > css.rfind('.study-center-word-actions{flex-direction:column')
          PY

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add study-center.css study-center.js index.html
          git commit -m 'Fix Study mobile scrolling and overflow'
          git push origin HEAD:feature/study-center
