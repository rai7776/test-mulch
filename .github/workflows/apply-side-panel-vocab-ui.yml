name: Apply side panel vocabulary UI

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/apply-side-panel-vocab-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-side-panel-vocab-ui.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check word-senses.js
          node --check flashcard-study.js
          node --check study-center.js
      - name: Check side panel vocabulary UI
        run: |
          grep -q "article-vocabulary-sense-rich" word-senses.js
          grep -q "wrapArticleVocabularyList" word-senses.js
          grep -q "article-vocabulary-memo-label" word-senses.js
          grep -q "otherSenseText" app.js
          ! grep -q "word-modal-hero" word-senses.js
          grep -q "app.js?v=4.1" index.html
          grep -q "word-senses.js?v=6" index.html
      - name: Commit changes
        run: |
          git config user.name "Smart Reader Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.js word-senses.js index.html
          git commit -m "Refine side panel vocabulary cards" || exit 0
          git push origin HEAD:feature/study-center
