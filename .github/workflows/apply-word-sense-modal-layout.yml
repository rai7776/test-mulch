name: Apply word sense modal layout

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/apply-word-sense-modal-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-word-sense-modal-layout.py
      - name: Check JavaScript syntax
        run: node --check word-senses.js
      - name: Check modal hierarchy
        run: |
          grep -q "文脈の意味" word-senses.js
          grep -q "その他の意味" word-senses.js
          grep -q "word-sense-row.is-secondary" word-senses.js
          grep -q "word-senses.js?v=3" index.html
      - name: Commit changes
        run: |
          git config user.name "Smart Reader Automation"
          git config user.email "actions@users.noreply.github.com"
          git add word-senses.js index.html
          git commit -m "Refine vocabulary sense modal hierarchy" || exit 0
          git push origin HEAD:feature/study-center
