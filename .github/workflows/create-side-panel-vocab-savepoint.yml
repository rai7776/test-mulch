name: Create side panel vocabulary savepoint

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/create-side-panel-vocab-savepoint.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create savepoint tag
        run: |
          tag="save/2026-09-16-before-side-panel-vocab-ui"
          target="86edb66ae0d93692cd8ac975523ce3269a64996c"
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
