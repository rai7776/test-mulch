name: Apply Study reward details

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/apply-study-reward-details.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-study-reward-details.py
      - name: Check JavaScript syntax
        run: |
          node --check flashcard-study.js
          node --check study-center.js
          node --check study-reward-ui.js
          node --check study-word-detail.js
      - name: Protect stable answer path
        run: |
          python - <<'PY'
          import re, subprocess
          before = subprocess.check_output(['git','show','save/2026-09-16-before-study-reward-details:flashcard-study.js'], text=True)
          after = open('flashcard-study.js').read()
          def fn(text, name):
              m = re.search(rf'^    function {name}\([^\n]*\) \{{', text, re.M)
              if not m: raise SystemExit(f'missing {name}')
              start = m.start()
              nxt = re.search(r'^    function [A-Za-z0-9_]+\(', text[m.end():], re.M)
              end = m.end()+nxt.start() if nxt else len(text)
              return text[start:end].strip()
          assert fn(before, 'answerCurrent') == fn(after, 'answerCurrent'), 'answerCurrent changed; stable answer path must stay identical'
          assert 'answerCurrent(result, { deferRender: true });' in after
          assert '}, 190);' in after
          assert 'attempt.known' not in fn(after, 'answerCurrent')
          PY
      - name: Check reward and detail hooks
        run: |
          grep -q "smartreader:study-answer-feedback" flashcard-study.js
          grep -q "retryActiveSession" flashcard-study.js
          grep -q "data-study-entry-key" study-center.js
          grep -q "苦手克服！" study-reward-ui.js
          grep -q "study-word-detail-overlay" study-word-detail.js
          grep -q "flashcard-study.js?v=1.15" index.html
          grep -q "study-center.js?v=12" index.html
          grep -q "study-reward-ui.js?v=1" index.html
          grep -q "study-word-detail.js?v=1" index.html
      - name: Commit changes
        run: |
          git config user.name "Smart Reader Automation"
          git config user.email "actions@users.noreply.github.com"
          git add flashcard-study.js study-center.js study-reward-ui.js study-word-detail.js index.html
          git commit -m "Add safe Study rewards and word details" || exit 0
          git push origin HEAD:feature/study-center
