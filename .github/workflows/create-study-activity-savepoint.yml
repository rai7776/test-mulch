name: Create study activity savepoint

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/create-study-activity-savepoint.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create savepoint tag
        run: |
          tag="save/2026-09-16-before-study-activity-calendar"
          target="ada6d941fb459b9437b0e2e1a5e3a2ec227930dc"
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
