name: Create folder study savepoint

on:
  push:
    branches: [feature/folder-study-range]
    paths:
      - '.github/workflows/create-folder-study-savepoint.yml'

permissions:
  contents: write

jobs:
  savepoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create stable save tag
        shell: bash
        run: |
          set -euo pipefail
          tag='save/2026-09-09-before-folder-study-range'
          target='007b1fa1cd0a92da5b791b6b1cc477ea7cd51968'
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
