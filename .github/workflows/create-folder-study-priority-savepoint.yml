name: Create folder study priority savepoint

on:
  push:
    branches: [feature/folder-study-priority]
    paths:
      - '.github/workflows/create-folder-study-priority-savepoint.yml'

permissions:
  contents: write

jobs:
  savepoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create stable save tag
        shell: bash
        run: |
          set -euo pipefail
          tag='save/2026-09-10-before-folder-study-priority'
          target='3dbf96c523c2616e944b55952b511369be9a70d1'
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
