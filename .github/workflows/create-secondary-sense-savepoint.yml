name: Create secondary sense display savepoint

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/create-secondary-sense-savepoint.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create savepoint tag
        run: |
          tag="save/2026-09-16-before-secondary-sense-display"
          target="dea72cf1ef4e58ff046bc1e09da137ec48c3d4c8"
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
