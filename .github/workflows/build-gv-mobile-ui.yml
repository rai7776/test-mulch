name: Build GV mobile UI
on:
  push:
    branches:
      - feature/gv-mobile-ui-run
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate UI
        env:
          GV_B64: 
        run: |
          python - <<'PY2'
          import os, base64, gzip
          from pathlib import Path
          Path('global-vocab-mobile-ui.js').write_bytes(gzip.decompress(base64.b64decode(os.environ['GV_B64'])))
          p=Path('index.html')
          s=p.read_text()
          marker='    <script src="flashcard-ui-tuning.js?v=1.1"></script>\n'
          line='    <script src="global-vocab-mobile-ui.js?v=1.0"></script>\n'
          if line not in s:
              if marker not in s: raise SystemExit('script marker missing')
              s=s.replace(marker, marker+line, 1)
              p.write_text(s)
          PY2
      - name: Validate
        run: |
          node --check global-vocab-mobile-ui.js
          grep -q 'grid-template-columns: repeat(2, minmax(0, 1fr))' global-vocab-mobile-ui.js
          grep -q 'gv-mobile-source-menu' global-vocab-mobile-ui.js
          grep -q 'expandedSourceFolders.clear' global-vocab-mobile-ui.js
          grep -q 'global-vocab-mobile-ui.js?v=1.0' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-vocab-mobile-ui.js index.html
          git commit -m "Redesign Global Vocabulary mobile UI" || exit 0
          git push
