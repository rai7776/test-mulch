name: Check chapter scope UI
on:
  push:
    branches:
      - feature/chapter-scope-ui
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load chapter scope UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '    <script src="bulk-import-mobile-fix.js?v=1.0"></script>\n'
          new = old + '    <script src="chapter-scope-ui.js?v=1.0"></script>\n'
          if 'chapter-scope-ui.js?v=1.0' not in s:
              if old not in s:
                  raise SystemExit('bulk mobile script tag not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Validate chapter scope implementation
        run: |
          node --check chapter-scope-ui.js
          grep -q 'chapter-scope-ui.js?v=1.0' index.html
          grep -q "scope:'chapter'" chapter-scope-ui.js
          grep -q '章ごとにまとめる' chapter-scope-ui.js
          grep -q '章未設定' chapter-scope-ui.js
          grep -q 'new Array(src.length)' chapter-scope-ui.js
          grep -q 'sparse\[i\]=item' chapter-scope-ui.js
          grep -q "state.scope==='article'" chapter-scope-ui.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load chapter scope UI"
          git push
