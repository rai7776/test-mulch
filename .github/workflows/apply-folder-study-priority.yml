name: Apply folder study priority

on:
  push:
    branches: [feature/folder-study-priority]
    paths:
      - '.github/workflows/apply-folder-study-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/folder-study-priority
          fetch-depth: 0
      - name: Patch selection logic
        run: python .github/scripts/patch-folder-study-priority.py
      - name: Check JavaScript syntax
        run: node --check folder-study-range.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add folder-study-range.js
          git commit -m 'Prioritize new and difficult words in folder study'
          git push origin HEAD:feature/folder-study-priority
