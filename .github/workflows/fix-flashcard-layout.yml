name: Fix flashcard mobile layout

on:
  push:
    branches:
      - feature/flashcard-layout-fix

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_flashcard_layout.py
      - name: Validate
        run: |
          node --check flashcard-ui-tuning.js
          grep -q 'flex-direction: column !important' flashcard-ui-tuning.js
          grep -q 'flashcard-ui-tuning.js?v=1.1' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flashcard-ui-tuning.js index.html
          git commit -m "Fix flashcard mobile stacking" || exit 0
          git push
