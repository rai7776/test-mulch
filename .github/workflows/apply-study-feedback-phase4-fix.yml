name: Apply Study Center feedback follow-up

on:
  push:
    branches: [feature/study-center]
    paths:
      - '.github/workflows/apply-study-feedback-phase4-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0
      - name: Apply follow-up patch
        run: python .github/scripts/patch-study-feedback-phase4-fix.py
      - name: Verify
        run: |
          set -euo pipefail
          node --check flashcard-study.js
          grep -Fq 'effect.progressAdvanced' flashcard-study.js
          grep -Fq 'attempt.known === 1' flashcard-study.js
      - name: Commit follow-up
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add flashcard-study.js
          git commit -m 'Make Study progress track resolved cards'
          git push origin HEAD:feature/study-center
