name: Implement adaptive flashcards
on:
  push:
    branches:
      - feature/adaptive-flashcard-review
jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch adaptive review and examples
        run: python .github/scripts/patch-adaptive-flashcards.py
      - name: Validate
        run: |
          node --check flashcard-study.js
          grep -q 'const STUDY_VERSION = 2' flashcard-study.js
          grep -q 'difficultyScore' flashcard-study.js
          grep -q 'lapseCount' flashcard-study.js
          grep -q 'adaptiveIntervalDays' flashcard-study.js
          grep -q 'lastSessionAttempts' flashcard-study.js
          grep -q 'study-example-mode' flashcard-study.js
          grep -q '苦手度' flashcard-study.js
          grep -q '忘却' flashcard-study.js
          grep -q 'flashcard-study.js?v=1.1' index.html
          python -c "f=lambda b,d:max(1,round(b*min(1.35,max(.55,1.45-d*.009)))) if b>1 else max(1,b); assert f(7,20)>f(7,50)>f(7,80); assert f(14,80)<14; print('adaptive interval checks ok')"
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flashcard-study.js index.html
          git commit -m "Add adaptive flashcard review and examples" || true
          git push
