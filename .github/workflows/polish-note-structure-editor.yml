name: Polish note structure editor
on:
  push:
    branches:
      - feature/note-structure-editor
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish editor behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('note-structure-editor.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('                        <button type="button" data-add-target class="note-structure-editor-target-add">＋接続点</button>\n', '')
          s = s.replace("        root.querySelector('[data-add-target]')?.addEventListener('click', addTarget);\n", '')
          s = s.replace("        wrapGlobal('switchModalType', () => loadFromContext(true));", "        wrapGlobal('switchModalType', () => loadFromContext(false));")
          old = """            new MutationObserver(() => {\n                const section = noteSection();\n                if (section && getComputedStyle(section).display !== 'none' && getComputedStyle(overlay).display !== 'none') loadFromContext(false);\n            }).observe(overlay, { attributes: true, attributeFilter: ['class', 'style'] });"""
          new = """            new MutationObserver(() => {\n                const section = noteSection();\n                const visible = section && getComputedStyle(section).display !== 'none' && getComputedStyle(overlay).display !== 'none';\n                if (visible) loadFromContext(false);\n                else if (getComputedStyle(overlay).display === 'none') resetContext();\n            }).observe(overlay, { attributes: true, attributeFilter: ['class', 'style'] });"""
          if old not in s:
              raise SystemExit('observer marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check note-structure-editor.js
          ! grep -q 'data-add-target' note-structure-editor.js
          grep -q "switchModalType', () => loadFromContext(false)" note-structure-editor.js
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note-structure-editor.js
          if ! git diff --cached --quiet; then
            git commit -m "Polish note structure editor behavior"
            git push
          fi
