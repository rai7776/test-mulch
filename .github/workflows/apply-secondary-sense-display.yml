name: Apply secondary sense display

on:
  push:
    branches: [feature/study-center]
    paths:
      - .github/workflows/apply-secondary-sense-display.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-center
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-secondary-sense-display.py
      - name: Check JavaScript syntax
        run: |
          node --check word-senses.js
          node --check flashcard-study.js
      - name: Check secondary sense hooks
        run: |
          grep -q "global-vocabulary-secondary-senses" word-senses.js
          grep -q "study-card-other-meanings" flashcard-study.js
          grep -q "getSenseDisplay" word-senses.js
          grep -q "flashcard-study.js?v=1.13" index.html
          grep -q "word-senses.js?v=2" index.html
      - name: Commit changes
        run: |
          git config user.name "Smart Reader Automation"
          git config user.email "actions@users.noreply.github.com"
          git add word-senses.js flashcard-study.js index.html
          git commit -m "Show secondary vocabulary senses in Study" || exit 0
          git push origin HEAD:feature/study-center
