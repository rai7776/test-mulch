name: Apply folder study ratio 70 25 5

on:
  push:
    branches: [feature/folder-study-priority-ratio]
    paths:
      - '.github/workflows/apply-folder-study-ratio-70-25-5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/folder-study-priority-ratio
          fetch-depth: 0
      - name: Update priority ratio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('folder-study-range.js')
          s = p.read_text()
          replacements = {
              'const targetNew = Math.round(limit * 0.60);': 'const targetNew = Math.round(limit * 0.70);',
              'const targetDifficult = Math.round(limit * 0.30);': 'const targetDifficult = Math.round(limit * 0.25);',
              '未学習60% / 苦手30% / その他10%を目安': '未学習70% / 苦手25% / その他5%を目安',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing target: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Check JavaScript syntax
        run: node --check folder-study-range.js
      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add folder-study-range.js
          git commit -m 'Adjust folder study mix to 70 25 5'
          git push origin HEAD:feature/folder-study-priority-ratio
