name: Check flashcard study
on:
  push:
    branches:
      - feature/flashcard-study
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load flashcard study
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '    <script src="chapter-scope-ui.js?v=1.0"></script>\n'
          new = old + '    <script src="flashcard-study.js?v=1.0"></script>\n'
          if 'flashcard-study.js?v=1.0' not in s:
              if old not in s:
                  raise SystemExit('chapter scope script tag not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Syntax and integration checks
        run: |
          node --check flashcard-study.js
          grep -q 'flashcard-study.js?v=1.0' index.html
          grep -q 'LEVEL_INTERVAL_DAYS = \[0, 1, 3, 7, 14, 30, 60\]' flashcard-study.js
          grep -q "result === 'known'" flashcard-study.js
          grep -q "result === 'unsure'" flashcard-study.js
          grep -q "result === 'wrong'" flashcard-study.js
          grep -q 'study-today-card' flashcard-study.js
          grep -q 'global-study-status' flashcard-study.js
          grep -q 'study-session-round' flashcard-study.js
          grep -q 'nextReviewAt' flashcard-study.js
      - name: Study scheduling unit checks
        run: |
          node <<'NODE'
          const fs=require('fs'), vm=require('vm');
          let src=fs.readFileSync('flashcard-study.js','utf8');
          src=src.replace("    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);\n    else init();", "    globalThis.__studyTest={studyView,readStudy,applyStudyResult,summarizeEntries,makeEntry,getAllStudyEntries,startOfLocalDay,setSession:(v)=>{session=v;}};");
          const sandbox={console,Date,Math,setTimeout,clearTimeout,window:null,document:{},libraryItems:[],currentArticle:null};
          sandbox.window=sandbox;
          vm.createContext(sandbox);
          vm.runInContext(src,sandbox);
          const t=sandbox.__studyTest;
          function assert(condition,message){if(!condition) throw new Error(message);}
          const article={id:1,type:'article',name:'Book',words:[]};
          const fresh={id:'a',word:'alpha',meaning:'A',memorized:false};
          article.words=[fresh]; sandbox.libraryItems=[article];
          assert(t.studyView(fresh).isNew,'fresh word must be new');
          const entry=t.makeEntry(article,fresh,0);
          t.setSession({evaluated:new Set()});
          t.applyStudyResult(entry,'known');
          assert(fresh.study.level===1,'first known should reach Lv1');
          const due=fresh.study.nextReviewAt;
          t.applyStudyResult(entry,'known');
          assert(fresh.study.level===1,'same session must not level twice');
          assert(fresh.study.sessionCount===1 && fresh.study.seenCount===2,'same-session counts invalid');
          assert(fresh.study.nextReviewAt===due,'same-session due date changed');
          const mastered={id:'m',word:'mastered',memorized:true};
          article.words.push(mastered);
          t.setSession({evaluated:new Set()});
          t.applyStudyResult(t.makeEntry(article,mastered,1),'wrong');
          assert(mastered.study.level===3 && mastered.memorized===false,'wrong mastered card must return to learning');
          const overdue={id:'o',word:'old',memorized:false,study:{level:2,nextReviewAt:t.startOfLocalDay()-86400000,seenCount:3,knownCount:2,unsureCount:0,wrongCount:1,sessionCount:1,correctStreak:0}};
          article.words.push(overdue);
          const summary=t.summarizeEntries(t.getAllStudyEntries());
          assert(summary.total===3 && summary.overdue===1,'overdue summary invalid');
          console.log('study unit checks passed');
          NODE
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load flashcard study"
          git push
