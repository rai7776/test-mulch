name: Apply article flashcard launcher

on:
  push:
    branches: [fix/article-flashcard-launcher]
    paths:
      - '.github/workflows/apply-article-flashcard-launcher.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/article-flashcard-launcher
          fetch-depth: 0
      - name: Create savepoint
        shell: bash
        run: |
          set -euo pipefail
          tag='save/2026-09-10-before-article-flashcard-launcher'
          target='b181a67b18c2d03d93b9f06e5a0c7a282e5962d8'
          git tag -f "$tag" "$target"
          git push origin -f "refs/tags/$tag"
      - name: Add launcher script and bust flashcard cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = '''    <script src="flashcard-study.js?v=1.1"></script>\n    <script src="flashcard-ui-tuning.js?v=1.1"></script>'''
          new = '''    <script src="flashcard-study.js?v=1.2"></script>\n    <script src="flashcard-ui-tuning.js?v=1.1"></script>\n    <script src="article-flashcard-launcher.js?v=1"></script>'''
          if old not in text:
              raise SystemExit('flashcard script anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify syntax and wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check article-flashcard-launcher.js
          grep -q 'flashcard-study.js?v=1.2' index.html
          grep -q 'article-flashcard-launcher.js?v=1' index.html
      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Reader Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore article flashcard launcher visibility'
          git push origin HEAD:fix/article-flashcard-launcher
