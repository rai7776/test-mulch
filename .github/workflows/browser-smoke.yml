name: Browser smoke

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  chrome-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/smart-reader-http.log 2>&1 &
          echo $! > /tmp/smart-reader-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/smart-reader-http.log
          exit 1
      - name: Start Chrome with DevTools
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/smart-reader-chrome-profile \
            http://127.0.0.1:4173/ \
            > /tmp/smart-reader-chrome-stdout.log \
            2> /tmp/smart-reader-chrome.log &
          echo $! > /tmp/smart-reader-chrome.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/smart-reader-chrome.log
          exit 1
      - name: Verify clean first-run app in real Chrome
        env:
          SMOKE_TIMEOUT_MS: '20000'
        run: node scripts/browser-smoke.mjs
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: |
            /tmp/smart-reader-chrome.log
            /tmp/smart-reader-chrome-stdout.log
            /tmp/smart-reader-http.log
