*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;line-height:1.55;font-size:15px;overflow-x:hidden}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #68b9aa;outline-offset:2px}.wrap{max-width:1000px;margin:auto;padding:0 20px}.top{background:#102c36;color:#fff}.toprow{min-height:82px;display:flex;gap:16px;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #6aa59d;border-radius:12px;font-weight:800;font-size:21px;color:#8de0c7}.brand strong{font-size:20px;letter-spacing:-.5px;display:block}.brand small{display:block;color:#b7cccf;font-size:11px;margin-top:-3px}.pill{border:1px solid #43616a;border-radius:20px;padding:5px 10px;font-size:11px;color:#bad8d1;white-space:nowrap}.nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 11px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{background:transparent;border:0;color:#b8cdcf;padding:10px 16px;border-radius:10px;font-weight:650;white-space:nowrap}.nav button.active{background:#2e535c;color:white}main{padding-top:24px;padding-bottom:100px}.headline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}.eyebrow{color:var(--accent);font-weight:760;font-size:12px;letter-spacing:.08em}.headline h1{font-size:clamp(23px,4vw,31px);line-height:1.28;margin:3px 0 0;letter-spacing:-.04em}.sub{color:var(--muted);margin:8px 0 0;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:15px 18px;min-width:0}.stat .k{color:var(--muted);font-size:12px}.stat .v{font-size:29px;font-weight:780;letter-spacing:-1px;margin-top:2px}.stat .tiny{font-size:11px;color:var(--muted);margin-top:1px}.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(230px,1fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);padding:22px;min-width:0}.panel + .panel{margin-top:15px}.grid2>.panel+.panel{margin-top:0}.section-title{font-size:16px;font-weight:780;letter-spacing:-.02em;margin:0 0 14px}.micro{font-size:12px;color:var(--muted)}.quiz-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.chip{border-radius:6px;background:#eff5f5;padding:5px 8px;color:#476469;font-size:11px;font-weight:700;display:inline-flex}.chip.teal{background:#e5f4ee;color:#13766b}.chip.amber{background:#fff3dd;color:#92610f}.chip.red{background:#fbeceb;color:#a14440}.vocab{font-size:clamp(30px,5.3vw,48px);font-weight:760;letter-spacing:-1.5px;line-height:1.2;overflow-wrap:anywhere;margin:41px 0 9px;text-align:center}.prompt{text-align:center;font-size:13px;color:var(--muted);margin-bottom:34px}.answer{background:var(--pale);border:1px solid #bee0d7;border-radius:13px;padding:17px;text-align:center;margin:16px 0 18px;min-height:70px;display:grid;align-content:center;gap:3px}.answer strong{font-size:22px;overflow-wrap:anywhere}.quizbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:11px;padding:13px 16px;font-weight:750;background:var(--accent);color:#fff;min-height:47px}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#edf3f3;color:var(--ink);border:1px solid #d4e1e1}.btn.danger{background:#f9eae9;color:#a44843}.btn.blue{background:var(--blue)}.btn.block{width:100%}.btn.sm{min-height:36px;padding:8px 11px;font-size:13px}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.footnote{font-size:12px;color:var(--muted);margin-top:15px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.hintbox{background:#f0f6f6;border:1px solid #dce9e8;border-radius:13px;padding:14px 15px}.hintbox strong{display:block;margin-bottom:5px;font-size:13px}.hintbox p{font-size:12px;color:var(--muted);margin:0}.rowline{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #edf1f1;padding:11px 0;font-size:13px}.rowline:last-child{border-bottom:0}.rowline span:last-child{font-weight:700;text-align:right}.bar{height:9px;background:#e6eeee;border-radius:30px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--accent);border-radius:30px}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.empty h3{color:var(--ink);margin:0 0 7px;font-size:18px}.empty p{max-width:460px;margin:6px auto 18px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.textarea{width:100%;min-height:165px;resize:vertical;border:1px solid #d0dbdb;border-radius:11px;padding:13px;background:white;line-height:1.7;font-size:14px}.input{background:#fff;border:1px solid #d0dbdb;border-radius:10px;padding:11px 12px;min-width:0;max-width:100%}.formlabel{display:block;font-size:13px;font-weight:740;margin:0 0 8px}.formhelp{font-size:12px;color:var(--muted);margin:7px 0 13px}.table-wrap{overflow-x:auto;max-width:100%}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th{text-align:left;color:#657a7e;font-size:11px;letter-spacing:.03em;background:#f4f8f8}th,td{padding:11px 10px;border-bottom:1px solid #e8eeee}tbody tr:last-child td{border-bottom:0}.table-wrap td:nth-child(1){font-weight:700}.group-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.groupbox{border-radius:12px;padding:13px;border:1px solid var(--line);background:#fbfcfc}.groupbox strong{font-size:24px;display:block}.groupbox small{display:block;color:var(--muted)}.groupbox .label{font-weight:700;font-size:12px;color:var(--ink)}.sectiongap{margin-top:20px}.warn{background:#fff7e7;border:1px solid #f1d79b;color:#74551f;padding:12px 14px;border-radius:10px;font-size:12px}.success{color:var(--accent)}.muted{color:var(--muted)}.divider{height:1px;background:var(--line);margin:21px 0}.smallcol{display:grid;gap:10px}.mono{font-variant-numeric:tabular-nums}.note{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:13px;background:#1c454d;color:#fff;box-shadow:0 12px 32px #102c3640;z-index:50;font-size:13px;max-width:calc(100% - 24px)}.hidden{display:none!important}.tag{font-size:11px;background:#eaf1f1;color:#426669;border-radius:5px;padding:3px 6px;white-space:nowrap}.summary{white-space:pre-wrap;background:#f4f8f8;border-radius:10px;padding:14px;font-size:12px;max-height:230px;overflow:auto;overflow-wrap:anywhere}.fileinput{font-size:12px;max-width:100%}.footer{padding:22px 0 30px;color:var(--muted);font-size:11px;text-align:center}.loading{margin-top:12px}.progress{display:flex;gap:4px;height:10px;background:#e7eeee;border-radius:10px;overflow:hidden}.progress>span{height:100%;display:block}.strong{font-weight:800}
@media(max-width:730px){.wrap{padding:0 14px}.toprow{min-height:72px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.panel{padding:18px;border-radius:16px}.stat{padding:12px}.stat .v{font-size:26px}.headline{align-items:start}.group-grid{grid-template-columns:1fr}.groupbox{display:flex;justify-content:space-between;align-items:center}.groupbox strong{font-size:21px}.quizbtns{grid-template-columns:1fr}.vocab{margin:35px 0 12px}.prompt{margin-bottom:24px}.btn{min-height:49px}.top .pill{display:none}table{font-size:12px}.nav button{padding:10px 13px}.footer{padding-bottom:38px}}
</style>

<body>
<header class="top"><div class="wrap"><div class="toprow"><div class="brand"><div class="mark">R</div><div><strong>Recall Lab</strong><small>英単語の記憶実験ツール</small></div></div><span class="pill">3分 / 10分 / 30分 比較実験</span></div><nav class="nav" aria-label="メニュー"><button data-tab="study" class="active">学習</button><button data-tab="analytics">実験結果</button><button data-tab="words">単語一覧</button><button data-tab="data">登録・データ</button></nav></div></header>
<main class="wrap"><div id="app"></div></main><div class="footer wrap">Recall Lab v1.0 | データはこのブラウザに保存。定期的なバックアップをおすすめします。</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='recall-lab-v1';
const GROUPS=[3,10,30];
const CHECKS=[{day:1,key:'d1',label:'1日後'},{day:7,key:'d7',label:'7日後'},{day:30,key:'d30',label:'30日後'},{day:90,key:'d90',label:'90日後'}];
const MIN=60000,DAY=86400000;
const $=s=>document.querySelector(s);
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>t?new Date(t).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const fmtShort=t=>t?new Date(t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const fmtDuration=n=>!Number.isFinite(n)||n<0?'—':n<MIN?Math.round(n/1000)+'秒':Math.round(n/MIN*10)/10+'分';
const fmtUntil=ms=>{if(ms<=0)return '今すぐ';if(ms<MIN)return Math.ceil(ms/1000)+'秒後';if(ms<3600000)return Math.ceil(ms/MIN)+'分後';if(ms<DAY)return Math.ceil(ms/3600000)+'時間後';return (ms/DAY).toFixed(1)+'日後'};
const mean=nums=>nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null;
let storageOK=true;let state={version:1,createdAt:Date.now(),cards:[],events:[]};
try{let v=localStorage.getItem(KEY);if(v){const p=JSON.parse(v);if(p?.version===1&&Array.isArray(p.cards)&&Array.isArray(p.events))state=p;else storageOK=false;}}catch(e){storageOK=false;console.warn('storage',e)}
let currentTab='study';let current=null;let lastCard=null;let filterWord='';let wordSort='timeDesc';let hiddenAt=null;let currentHiddenMs=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;return true}catch(e){storageOK=false;toast('保存できません。JSONでバックアップしてください。');return false}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),4200)}
function gLabel(c){return Number.isInteger(c.group)?GROUPS[c.group]+'分':'未割当'}
function pLabel(c){return ({new:'未着手',learning:'未習得',short:'短期確認待ち',short_retry:'短期再学習',long:'長期復習',long_retry:'長期再学習',done:'90日確認済み'})[c.phase]||c.phase}
function isDue(c,now=Date.now()){return c.phase!=='new'&&c.phase!=='done'&&Number.isFinite(c.dueAt)&&c.dueAt<=now}
function dueCards(now=Date.now()){return state.cards.filter(c=>isDue(c,now)).sort((a,b)=>a.dueAt-b.dueAt)}
function eligibleCard(){const now=Date.now();const due=dueCards(now);if(due.length){const chosen=due.find(x=>x.id!==lastCard)||due[0];return chosen;}return state.cards.find(x=>x.phase==='new'&&x.id!==lastCard)||state.cards.find(x=>x.phase==='new')||null}
function nextDue(){const d=state.cards.filter(c=>Number.isFinite(c.dueAt)&&c.dueAt>Date.now()&&c.phase!=='done');return d.length?Math.min(...d.map(x=>x.dueAt)):null}
function counts(){const n=Date.now();return {all:state.cards.length,due:state.cards.filter(c=>isDue(c,n)).length,new:state.cards.filter(c=>c.phase==='new').length,seen:state.cards.filter(c=>!!c.firstCorrectAt).length,waiting:state.cards.filter(c=>c.dueAt>n&&c.phase!=='done').length,completed:state.cards.filter(c=>c.phase==='done').length}}
function stats(){const x=counts();return `<div class="stats"><div class="stat"><div class="k">登録単語</div><div class="v mono">${x.all}</div><div class="tiny">英語 → 日本語</div></div><div class="stat"><div class="k">復習が必要</div><div class="v mono">${x.due}</div><div class="tiny">期限を迎えたカード</div></div><div class="stat"><div class="k">初回正答済み</div><div class="v mono">${x.seen}</div><div class="tiny">習得完了ではありません</div></div><div class="stat"><div class="k">時間待ち</div><div class="v mono">${x.waiting}</div><div class="tiny">間隔を空けて再出題</div></div></div>`}
function headline(title,kicker='記憶実験',sub=''){return `<div class="headline"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div></div>`}
function setTab(t){if(current&&t!=='study'){current=null;currentHiddenMs=0}currentTab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function present(c){const now=Date.now();if(!c.firstShownAt){c.firstShownAt=now;save()}current={id:c.id,shownAt:now,scheduledAt:c.dueAt,stage:c.phase,answerShown:false,revealedAt:null};currentHiddenMs=0;render()}
function startCard(){const c=eligibleCard();if(c)present(c);else{current=null;render()}}
function groupFor(attempts){const bucket=attempts<=1?'fast':attempts<=3?'medium':'slow';const seen=state.cards.filter(c=>c.groupBucket===bucket&&Number.isInteger(c.group));const cnt=GROUPS.map((_,i)=>seen.filter(x=>x.group===i).length);const min=Math.min(...cnt);const eligible=cnt.map((n,i)=>n===min?i:-1).filter(i=>i>=0);return eligible[Math.floor(Math.random()*eligible.length)]}
function nextMilestone(c,now){if(c.longIndex>=CHECKS.length){c.phase='done';c.dueAt=null;return}const wanted=c.firstCorrectAt+CHECKS[c.longIndex].day*DAY;c.phase='long';c.dueAt=Math.max(wanted,now+60*MIN)}
function grade(correct){if(!current||!current.answerShown)return;const card=state.cards.find(x=>x.id===current.id);if(!card)return;const now=Date.now(),stage=current.stage;card.totalAttempts=(card.totalAttempts||0)+1;const event={id:uid(),cardId:card.id,word:card.word,at:now,shownAt:current.shownAt,stage,correct,group:card.group,scheduledAt:current.scheduledAt,ageSinceFirstCorrectMs:card.firstCorrectAt?now-card.firstCorrectAt:null,actualGapFromPreviousMs:card.lastAttemptAt?now-card.lastAttemptAt:null,responseMs:Math.max(0,((current.revealedAt||now)-current.shownAt)-currentHiddenMs),interveningAnswers:card.lastAttemptEventIndex===undefined?0:state.events.length-card.lastAttemptEventIndex-1,checkpoint:null};
if(stage==='long'){event.checkpoint=CHECKS[card.longIndex]?.key||null;event.checkpointTargetDays=CHECKS[card.longIndex]?.day||null}
if(stage==='new'||stage==='learning'){
  card.attemptsToFirstCorrect=(card.attemptsToFirstCorrect||0)+1;
  if(correct){card.firstCorrectAt=now;card.firstLearnElapsedMs=now-card.firstShownAt;card.firstLearnActiveMs=(card.firstLearnActiveMs||0)+event.responseMs;card.groupBucket=card.attemptsToFirstCorrect<=1?'fast':card.attemptsToFirstCorrect<=3?'medium':'slow';card.group=groupFor(card.attemptsToFirstCorrect);card.phase='short';card.dueAt=now+GROUPS[card.group]*MIN;event.group=card.group;}
  else{card.firstLearnActiveMs=(card.firstLearnActiveMs||0)+event.responseMs;card.phase='learning';card.dueAt=now+90*1000}
}else if(stage==='short'){
  card.shortProbeCorrect=correct;card.shortProbeAt=now;
  if(correct){card.longIndex=0;nextMilestone(card,now)}else{card.phase='short_retry';card.dueAt=now+3*MIN}
}else if(stage==='short_retry'){
  if(correct){card.longIndex=0;nextMilestone(card,now)}else{card.dueAt=now+3*MIN}
}else if(stage==='long'){
  card.longIndex++;
  if(correct)nextMilestone(card,now);else{card.phase='long_retry';card.dueAt=now+3*MIN}
}else if(stage==='long_retry'){
  if(correct)nextMilestone(card,now);else card.dueAt=now+3*MIN
}
card.lastAttemptAt=now;card.lastCorrect=correct;state.events.push(event);card.lastAttemptEventIndex=state.events.length-1;lastCard=card.id;current=null;currentHiddenMs=0;save();startCard();toast(correct?'正答を記録しました':'不正解を記録しました。間隔を空けて再出題します');}
function renderStudy(){const x=counts();let body='';if(!state.cards.length){body=`<div class="panel empty"><h3>まず英単語を登録してください</h3><p>1行に「英単語 [Tab] 日本語訳」を入力します。100語ずつでも7語ずつでも登録できます。</p><button class="btn" data-action="to-data">単語を登録する</button></div>`}
else if(!current){const card=eligibleCard();if(card){setTimeout(()=>{if(currentTab==='study'&&!current)startCard()},0);return headline('学習','EXPERIMENT MODE','短期復習の時刻は自動管理します。')+stats()+`<div class="panel empty">出題を準備しています…</div>`}
const next=nextDue();body=`<div class="panel empty"><h3>今すぐ出題するカードはありません</h3><p>${next?'次の復習は '+fmtUntil(next-Date.now())+' です。':'登録したカードはすべて90日後までの確認が完了しています。'} 同じ3語だけを繰り返すことはしません。</p><div class="flex" style="justify-content:center"><button class="btn secondary" data-action="refresh">更新する</button><button class="btn" data-action="to-data">単語を追加する</button></div></div>`}
else{const c=state.cards.find(x=>x.id===current.id);if(!c){current=null;return renderStudy()}const badge=c.phase==='new'?'新規':c.phase==='learning'?'未習得':c.phase==='short'?'短期確認':c.phase==='long'?(CHECKS[c.longIndex]?.label||'長期復習'):'再学習';body=`<div class="grid2"><section class="panel"><div class="quiz-meta"><span class="chip ${c.phase==='long'?'teal':c.phase==='learning'?'red':'amber'}">${escape(badge)}</span><span>初回正答まで ${c.attemptsToFirstCorrect||0} 回試行${c.firstCorrectAt?' · '+escape(gLabel(c)):''}</span></div><h2 class="vocab">${escape(c.word)}</h2><p class="prompt">日本語の意味を、答えを見る前に思い出してください</p>${current.answerShown?`<div class="answer"><span class="micro">正解</span><strong>${escape(c.meaning)}</strong></div><p class="micro" style="text-align:center">答えを見る前に思い出せたかどうかで判定してください</p><div class="quizbtns"><button class="btn danger" data-action="wrong">思い出せなかった</button><button class="btn" data-action="right">思い出せた</button></div>`:`<button class="btn block" data-action="reveal">答えを見る</button>`}<div class="footnote">初回習得後は3分・10分・30分のいずれかにランダム割当。間隔を空けて再出題します。</div></section><aside class="smallcol"><section class="panel"><h3 class="section-title">学習キュー</h3>${rowline('復習期限を迎えたカード',x.due+'語')}${rowline('未着手',x.new+'語')}${rowline('待機中',x.waiting+'語')}${rowline('初回正答済み',x.seen+'語')}</section><section class="panel"><h3 class="section-title">このカードの記録</h3>${rowline('初回正答まで',c.firstCorrectAt?fmtDuration(c.firstLearnElapsedMs):'学習中')}${rowline('初回正答までの試行',c.attemptsToFirstCorrect||0+'回')}${rowline('条件',gLabel(c))}${rowline('次の状態',pLabel(c))}</section></aside></div>`}
return headline('英単語を学習する','RECALL LAB','正答しただけで「定着」とは判定しません。時間を空けた再テストを別管理します。')+stats()+body+`<p class="footnote">※ この実験は研究用の試作です。正答率や間隔は個人ごとの最適値を保証するものではありません。</p>`}
function rowline(a,b){return `<div class="rowline"><span>${escape(a)}</span><span class="mono">${escape(b)}</span></div>`}
function report(){const groups=GROUPS.map((delay,index)=>{const cards=state.cards.filter(c=>c.group===index);const acq=cards.map(c=>c.firstLearnElapsedMs).filter(Number.isFinite);const probes=state.events.filter(e=>e.stage==='short'&&e.group===index);const milestones=Object.fromEntries(CHECKS.map(check=>{const e=state.events.filter(ev=>ev.checkpoint===check.key&&ev.group===index);return [check.key,{n:e.length,correct:e.filter(x=>x.correct).length,rate:e.length?e.filter(x=>x.correct).length/e.length:null,meanActualDays:e.length?mean(e.map(x=>x.ageSinceFirstCorrectMs/DAY)):null}]}));return {delay,count:cards.length,meanAttempts:mean(cards.map(c=>c.attemptsToFirstCorrect)),meanFirstLearnMin:acq.length?mean(acq)/MIN:null,short:{n:probes.length,correct:probes.filter(e=>e.correct).length,rate:probes.length?probes.filter(e=>e.correct).length/probes.length:null},milestones}});return {createdAt:state.createdAt,generatedAt:Date.now(),cardCount:state.cards.length,eventCount:state.events.length,groups}}
function percent(rate){return rate===null?'未測定':(100*rate).toFixed(1)+'%'}
function analyseMetric(r,name){return `<div class="table-wrap"><table><thead><tr><th>復習条件</th><th>測定済み</th><th>正答</th><th>正答率</th><th>実際の測定時期</th></tr></thead><tbody>${r.groups.map(g=>{const z=name==='short'?g.short:g.milestones[name];return `<tr><td>${g.delay}分</td><td>${z.n}</td><td>${z.correct}</td><td class="strong">${percent(z.rate)}</td><td>${name==='short'?'初回習得後':z.meanActualDays===null?'—':z.meanActualDays.toFixed(1)+'日後（平均）'}</td></tr>`}).join('')}</tbody></table></div>`}
function renderAnalytics(){const r=report();const dayData=CHECKS.map(check=>{const sum=state.events.filter(e=>e.checkpoint===check.key);return {label:check.label,count:sum.length,correct:sum.filter(e=>e.correct).length}});const allDay=dayData[2];return headline('実験結果','ANALYTICS','復習間隔と翌日・7日・30日・90日後の保持率を比較します。')+stats()+`<div class="grid2"><section class="panel"><h3 class="section-title">3条件の割り当て状況</h3><div class="group-grid">${r.groups.map(g=>`<div class="groupbox"><div><span class="label">${g.delay}分後</span><strong>${g.count}<small style="display:inline"> 語</small></strong></div><small>初回試行 平均 ${g.meanAttempts===null?'—':g.meanAttempts.toFixed(1)+'回'}</small></div>`).join('')}</div><div class="divider"></div><h3 class="section-title">短期再確認の正答率</h3>${analyseMetric(r,'short')}</section><aside class="panel"><h3 class="section-title">評価に必要なこと</h3><div class="hintbox"><strong>30日後を中心に比較</strong><p>初回習得の時間を記録し、3・10・30分条件で翌日・7日・30日・90日後の結果を比べます。指定時刻に出題できない場合は実際の遅延も記録します。</p></div><div class="sectiongap">${rowline('全回答数',state.events.length+'回')}${rowline('30日後テスト',allDay.count+'回')}${rowline('30日後 正答',allDay.correct+'回')}</div></aside></div><div class="panel sectiongap"><h3 class="section-title">長期保持の比較</h3>${CHECKS.map(k=>`<h4 class="micro" style="font-size:13px;color:var(--ink);margin:22px 0 8px">${k.label}</h4>${analyseMetric(r,k.key)}`).join('')}<div class="warn sectiongap">各条件のテスト数が少ないうちは、数字の大小から最適な間隔を断定できません。1人で集めたデータは、その人の学習条件での探索的な結果です。</div></div><div class="panel sectiongap"><h3 class="section-title">初回習得と1日後の関係</h3>${acquisitionTable()}</div><div class="panel sectiongap"><h3 class="section-title">分析用データ</h3><p class="note">ここに表示している数字より詳しく調べるには、回答ごとの履歴を含むJSONをChatGPTへ添付してください。</p><div class="flex"><button class="btn" data-action="copy-report">レポートをコピー</button><button class="btn secondary" data-action="export-json">全記録をJSON保存</button><button class="btn ghost" data-action="export-events">回答履歴をCSV保存</button></div></div>`}
function acquisitionTable(){const groupNames=[['1回で正答',c=>c.attemptsToFirstCorrect===1],['2〜3回',c=>c.attemptsToFirstCorrect>=2&&c.attemptsToFirstCorrect<=3],['4回以上',c=>c.attemptsToFirstCorrect>=4]];return `<div class="table-wrap"><table><thead><tr><th>初回習得</th><th>習得済み語数</th><th>1日後のテスト数</th><th>1日後の正答率</th></tr></thead><tbody>${groupNames.map(([label,fn])=>{const cards=state.cards.filter(c=>c.firstCorrectAt&&fn(c));const ids=new Set(cards.map(c=>c.id));const trials=state.events.filter(e=>e.checkpoint==='d1'&&ids.has(e.cardId));return `<tr><td>${label}</td><td>${cards.length}</td><td>${trials.length}</td><td>${percent(trials.length?trials.filter(e=>e.correct).length/trials.length:null)}</td></tr>`}).join('')}</tbody></table></div><p class="footnote">相関を見つけるための集計です。短期復習間隔や単語難易度の影響が混ざるため、因果関係までは示しません。</p>`}
function renderWords(){return headline('単語一覧','VOCABULARY','初回習得時間・試行回数・復習予定を確認できます。')+stats()+`<section class="panel"><div class="flex between"><h3 class="section-title" style="margin:0">登録済み単語</h3><button class="btn sm secondary" data-action="to-data">追加する</button></div><div class="controls"><input id="word-search" class="input" placeholder="単語・意味を検索" value="${escape(filterWord)}" style="flex:1;min-width:150px" /><select id="word-sort" class="input" aria-label="単語の並び替え"><option value="timeDesc" ${wordSort==='timeDesc'?'selected':''}>習得時間が長い順</option><option value="attemptsDesc" ${wordSort==='attemptsDesc'?'selected':''}>試行回数が多い順</option><option value="dueAsc" ${wordSort==='dueAsc'?'selected':''}>復習時刻が早い順</option><option value="alphabet" ${wordSort==='alphabet'?'selected':''}>英単語順</option><option value="original" ${wordSort==='original'?'selected':''}>登録順</option></select></div><div id="word-results">${wordRows()}</div></section>`}
function wordRows(){let c=state.cards.filter(x=>(x.word+' '+x.meaning).toLowerCase().includes(filterWord.toLowerCase()));if(wordSort==='timeDesc')c.sort((a,b)=>(b.firstLearnElapsedMs??-1)-(a.firstLearnElapsedMs??-1));else if(wordSort==='attemptsDesc')c.sort((a,b)=>(b.attemptsToFirstCorrect||0)-(a.attemptsToFirstCorrect||0));else if(wordSort==='dueAsc')c.sort((a,b)=>(a.dueAt??Infinity)-(b.dueAt??Infinity));else if(wordSort==='alphabet')c.sort((a,b)=>a.word.localeCompare(b.word));return c.length?`<p class="micro">${c.length}語を表示</p><div class="table-wrap"><table><thead><tr><th>単語</th><th>意味</th><th>状態</th><th>初回習得</th><th>条件</th><th>次回</th></tr></thead><tbody>${c.map(x=>`<tr><td>${escape(x.word)}</td><td>${escape(x.meaning)}</td><td>${escape(pLabel(x))}</td><td>${x.firstCorrectAt?fmtDuration(x.firstLearnElapsedMs)+' / '+x.attemptsToFirstCorrect+'回':'—'}</td><td>${escape(gLabel(x))}</td><td>${x.dueAt?fmtShort(x.dueAt):'—'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">該当する単語がありません。</div>`}
function renderData(){return headline('登録・データ管理','DATA & BACKUP','単語を登録し、学習記録を保存・共有できます。')+`<div class="grid2"><section class="panel"><h3 class="section-title">単語を追加する</h3><label class="formlabel" for="words-input">1行に「英単語 [Tab] 日本語訳」</label><textarea id="words-input" class="textarea" placeholder="abandon\t放棄する\nalleviate\t軽減する\nresilient\t回復力のある"></textarea><p class="formhelp">タブ、カンマ、縦棒（|）で区切れます。重複する英単語は追加せずスキップします。ひとつの意味にカンマが入る場合はタブ区切りをおすすめします。</p><div class="flex"><button class="btn" data-action="add-words">単語を登録する</button><button class="btn secondary" data-action="sample">サンプル12語を登録</button></div><p id="import-feedback" class="note"></p></section><aside class="panel"><h3 class="section-title">現在の実験ルール</h3>${rowline('短期比較', '3 / 10 / 30分')}${rowline('誤答後の再出題','約1.5〜3分後')}${rowline('長期テスト','1 / 7 / 30 / 90日後')}${rowline('採点','2段階の自己判定')}${rowline('保存先','この端末・ブラウザ')}<p class="footnote">実験条件は初回正答した時に、初回の試行回数をそろえるよう3群へ割り当てます。</p></aside></div><section class="panel sectiongap"><h3 class="section-title">私に記録を共有する</h3><div class="hintbox"><strong>おすすめ：JSONファイルをこのチャットに添付</strong><p>回答日時・正誤・単語・初回習得時間・実験条件・復習遅延などがすべて含まれます。添付されたファイルを私が読み込み、復習間隔ごとの保持率や習得速度との関係を分析できます。共有するまでは私からデータを見ることはできません。</p></div><div class="controls"><button class="btn" data-action="export-json">全記録をJSON保存</button><button class="btn secondary" data-action="copy-report">要約をコピー</button><button class="btn ghost" data-action="export-events">回答履歴CSV</button><button class="btn ghost" data-action="export-cards">単語状態CSV</button></div><p class="note">JSONは復元用バックアップにもなります。スマホ・PC間の自動同期はありません。</p><div class="divider"></div><h3 class="section-title">バックアップを復元する</h3><input type="file" id="restore-json" class="fileinput" accept=".json,application/json"/><p class="note">現在の学習データを全置換します。必要なら先にバックアップしてください。</p><div class="divider"></div><h3 class="section-title">初期化</h3><button class="btn danger sm" data-action="reset">学習記録をすべて削除する</button></section>`}
function render(){let html=currentTab==='study'?renderStudy():currentTab==='analytics'?renderAnalytics():currentTab==='words'?renderWords():renderData();if(!storageOK)html=`<div class="warn" style="margin-bottom:16px">ブラウザへの保存に失敗しています。プライベートブラウズを解除するか、データを書き出してください。</div>`+html;$('#app').innerHTML=html}
function parseWords(text){const lines=text.split(/\r?\n/);const items=[],bad=[];for(let i=0;i<lines.length;i++){const raw=lines[i].trim();if(!raw)continue;let sep;if(raw.includes('\t'))sep='\t';else if(raw.includes('|'))sep='|';else if(raw.includes('｜'))sep='｜';else if(raw.includes(','))sep=',';else{bad.push(i+1);continue}const ix=raw.indexOf(sep);let w=raw.slice(0,ix).trim().replace(/^"|"$/g,''),m=raw.slice(ix+sep.length).trim().replace(/^"|"$/g,'');if(!w||!m){bad.push(i+1);continue}items.push({word:w,meaning:m})}return {items,bad}}
function addWords(text){const {items,bad}=parseWords(text);const unique=new Set(state.cards.map(c=>c.word.toLocaleLowerCase()));let added=0,dupe=0;for(const i of items){const key=i.word.toLocaleLowerCase();if(unique.has(key)){dupe++;continue}unique.add(key);state.cards.push({id:uid(),word:i.word,meaning:i.meaning,createdAt:Date.now(),phase:'new',firstShownAt:null,firstCorrectAt:null,attemptsToFirstCorrect:0,firstLearnElapsedMs:null,firstLearnActiveMs:0,totalAttempts:0,group:null,groupBucket:null,shortProbeCorrect:null,shortProbeAt:null,lastAttemptAt:null,lastCorrect:null,longIndex:0,dueAt:null});added++}save();return {added,dupe,bad}}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
const ymd=()=>new Date().toISOString().slice(0,10);
function exportJSON(){download('recall-lab-'+ymd()+'.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');toast('全記録をJSONで保存しました')}
function csv(rows){return '\ufeff'+rows.map(cols=>cols.map(v=>'"'+String(v===null||v===undefined?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function exportEvents(){const cols=['id','cardId','word','at','shownAt','stage','correct','group','scheduledAt','ageSinceFirstCorrectMs','actualGapFromPreviousMs','responseMs','interveningAnswers','checkpoint','checkpointTargetDays'];download('recall-lab-events-'+ymd()+'.csv',csv([cols,...state.events.map(e=>cols.map(k=>e[k]))]),'text/csv;charset=utf-8');toast('回答履歴CSVを保存しました')}
function exportCards(){const cols=['id','word','meaning','phase','createdAt','firstShownAt','firstCorrectAt','firstLearnElapsedMs','firstLearnActiveMs','attemptsToFirstCorrect','totalAttempts','group','shortProbeCorrect','shortProbeAt','longIndex','dueAt','lastAttemptAt'];download('recall-lab-cards-'+ymd()+'.csv',csv([cols,...state.cards.map(e=>cols.map(k=>e[k]))]),'text/csv;charset=utf-8');toast('単語状態CSVを保存しました')}
function compactReport(){const r=report();const lines=[`Recall Lab 学習実験レポート（${fmtDate(r.generatedAt)}）`,`単語数: ${r.cardCount} / 回答数: ${r.eventCount}`,`初回復習条件は3分・10分・30分。長期チェックは1・7・30・90日後。`,`各条件のデータ:`];for(const g of r.groups){lines.push(`【${g.delay}分群】${g.count}語、初回正答まで平均 ${g.meanAttempts===null?'—':g.meanAttempts.toFixed(2)}回、初回習得経過時間 平均 ${g.meanFirstLearnMin===null?'—':g.meanFirstLearnMin.toFixed(2)}分`);lines.push('短期確認 '+g.short.correct+'/'+g.short.n+' ('+percent(g.short.rate)+')');for(const k of CHECKS){const m=g.milestones[k.key];lines.push(k.label+' '+m.correct+'/'+m.n+' ('+percent(m.rate)+')'+(m.meanActualDays!==null?' 実測平均'+m.meanActualDays.toFixed(1)+'日後':''))}}lines.push('注: 単語群は初回習得時の試行数で層別ランダム割当。期日超過・少数標本・自己判定による誤差があります。');lines.push('この結果を探索的に分析し、短期復習間隔を提案してください。厳密な分析にはJSON全履歴が必要です。');return lines.join('\n')}
async function copyReport(){let txt=compactReport();try{await navigator.clipboard.writeText(txt);toast('レポートをコピーしました。チャットに貼り付けてください')}catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();if(ok)toast('レポートをコピーしました');else{window.prompt('以下をコピーしてください',txt)}}}
function restore(file){if(!file)return;const reader=new FileReader();reader.onerror=()=>toast('ファイルを読み込めませんでした');reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.version!==1||!Array.isArray(obj.cards)||!Array.isArray(obj.events))throw new Error('形式が正しくありません');if(obj.cards.length>100000||obj.events.length>2000000)throw new Error('ファイルサイズが想定を超えています');if(!obj.cards.every(c=>typeof c.id==='string'&&typeof c.word==='string'&&typeof c.meaning==='string'))throw new Error('単語データが不正です');if(!obj.events.every(e=>typeof e.cardId==='string'&&typeof e.at==='number'&&typeof e.correct==='boolean'))throw new Error('回答履歴が不正です');if(!confirm('現在の学習記録を置き換えます。よろしいですか？\n復元内容：'+obj.cards.length+'語 / '+obj.events.length+'回答'))return;state={version:1,createdAt:obj.createdAt||Date.now(),cards:obj.cards,events:obj.events};current=null;lastCard=null;save();render();toast('バックアップを復元しました')}catch(e){toast('復元に失敗: '+e.message)}};reader.readAsText(file)}
const SAMPLE=`abandon\t放棄する\nalleviate\t軽減する\nresilient\t回復力のある\nconspicuous\t目立つ\nmeticulous\t几帳面な\nplausible\tもっともらしい\nambiguous\t曖昧な\nreluctant\t気が進まない\nsubstantial\tかなりの\ndeteriorate\t悪化する\npragmatic\t実用的な\ncoherent\t一貫した`;
document.querySelectorAll('.nav button').forEach(btn=>btn.addEventListener('click',()=>setTab(btn.dataset.tab)));
$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const op=b.dataset.action;if(op==='to-data')setTab('data');if(op==='refresh'){current=null;render()}if(op==='reveal'&&current){current.revealedAt=Date.now();current.answerShown=true;render()}if(op==='right')grade(true);if(op==='wrong')grade(false);if(op==='export-json')exportJSON();if(op==='export-events')exportEvents();if(op==='export-cards')exportCards();if(op==='copy-report')await copyReport();if(op==='add-words'||op==='sample'){const text=op==='sample'?SAMPLE:$('#words-input')?.value||'';const res=addWords(text);render();const info=`${res.added}語を登録。重複${res.dupe}語${res.bad.length?'、形式不正 '+res.bad.join(', ')+'行':''}`;toast(info)}if(op==='reset'){if(confirm('全ての学習記録を削除します。取り消せません。よろしいですか？')&&confirm('本当に削除しますか？')){state={version:1,createdAt:Date.now(),cards:[],events:[]};current=null;lastCard=null;save();render();toast('全記録を初期化しました')}}});
$('#app').addEventListener('input',e=>{if(e.target.id==='word-search'){filterWord=e.target.value;const el=$('#word-results');if(el)el.innerHTML=wordRows()}});
$('#app').addEventListener('change',e=>{if(e.target.id==='restore-json'){restore(e.target.files?.[0]);e.target.value=''}if(e.target.id==='word-sort'){wordSort=e.target.value;const el=$('#word-results');if(el)el.innerHTML=wordRows()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now()}else if(hiddenAt){const delta=Date.now()-hiddenAt;if(current)currentHiddenMs+=delta;hiddenAt=null;if(currentTab==='study'&&!current)render()}});
setInterval(()=>{if(currentTab==='study'&&!current)render()},10000);
render();
})();
</script>
</body>
</html>
