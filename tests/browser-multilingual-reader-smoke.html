<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multilingual Reader controls smoke</title>
<link rel="stylesheet" href="../style.css?v=1.4">
<link rel="stylesheet" href="../chinese-learning.css?v=7">
<link rel="stylesheet" href="../learning-ui.css?v=4">
</head>
<body class="learning-ui">
<div id="reader-wrapper" style="display:flex;flex-direction:column">
    <div id="reader-search-bar">検索</div>
    <div id="chapter-navigation">章</div>
    <div id="text-display"><p data-paragraph-index="0">First <span class="word-highlight" data-word-index="0">sentence</span>. Second sentence!</p></div>
    <div id="chinese-reader-options" hidden>
        <div class="reader-display-options"><label><input id="chinese-reader-pinyin-visible" type="checkbox" checked>拼音を表示</label></div>
        <div class="reader-audio-controls"><button type="button">▶ 連続再生</button><button id="chinese-selection-audio" type="button" disabled>選択範囲</button><button>停止</button>
            <details class="reader-audio-settings"><summary>音声設定</summary><select id="chinese-speech-rate"><option value="0.85">0.85×</option></select></details>
        </div>
        <span id="chinese-audio-status"></span>
    </div>
    <div id="reading-status-bar"></div>
</div>
<button id="add-btn" class="fab-btn">＋</button>
<button id="fab-toggle" class="fab-btn">📋</button>
<button id="bulk-add-btn" class="fab-btn">一括</button>
<script src="../speech-language-core.js"></script>
<script src="../language-profile.js"></script>
<script src="../learning-targets.js"></script>
<script src="../chinese-learning.js"></script>
<script>
try {
    window.SmartReaderWorkspaceState={activeWorkspace:{kind:'language',contentLanguage:'en'}};
    const display=document.getElementById('text-display');
    const toolbar=document.getElementById('chinese-reader-options');
    const pinyinControls=toolbar.querySelector('.reader-display-options');
    const fabIds=['add-btn','fab-toggle','bulk-add-btn'];
    function check(value,message){if(!value)throw Error(message);}
    SmartReaderChinese.decorateReader(display,{words:[]},true);
    SmartReaderChinese.syncReaderControls({words:[]},true);
    check(!toolbar.hidden,'English Reader audio toolbar is hidden');
    check(pinyinControls.hidden,'English Reader shows Chinese pinyin controls');
    check(display.querySelectorAll('button.chinese-sentence-audio').length===2,'English sentences missing audio buttons');
    check(display.textContent==='First sentence. Second sentence!','Audio spans modified source text');
    check(!display.querySelector('.chinese-character'),'English text received Chinese pinyin spans');
    check(display.querySelector('.word-highlight')?.textContent==='sentence','Speech decoration damaged vocabulary highlight');
    check(fabIds.every(id=>getComputedStyle(document.getElementById(id)).display==='none'),'Editor has floating Reader actions');
    document.body.classList.add('reader-mode-active');
    check(fabIds.every(id=>getComputedStyle(document.getElementById(id)).display!=='none'),'Reader action missing');
    const addRect=document.getElementById('add-btn').getBoundingClientRect();
    const bulkRect=document.getElementById('bulk-add-btn').getBoundingClientRect();
    if (window.innerWidth <= 767) check(addRect.left < bulkRect.left,'Mobile Reader action order not shared');
    document.body.classList.remove('reader-mode-active');
    check(fabIds.every(id=>getComputedStyle(document.getElementById(id)).display==='none'),'Editing action buttons not hidden');
    document.body.dataset.result='multilingual-reader-smoke-ok';
} catch(error) {
    document.body.dataset.result='multilingual-reader-smoke-failed: '+error.message;
}
</script>
</body>
</html>
